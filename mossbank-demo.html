<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#eee7d0">
<title>动物小住 · 动物滑块谜题</title>
<style>
:root {
  color-scheme: light;
  --ink: #2f3e2d;
  --muted: #5e664f;
  --paper: #fff9e9;
  --line: #dfd8bd;
  --green: #36513a;
  --green-dark: #263e2e;
  --peach: #d7985f;
  --serif: "Songti SC", "STSong", "Noto Serif CJK SC", "SimSun", serif;
  font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
}
* { box-sizing: border-box; }
body {
  min-width: 300px;
  margin: 0;
  color: var(--ink);
  min-height: 100vh;
  background: radial-gradient(ellipse at 48% 12%, #f9f2d3 0%, #eaeac7 57%, #ccd7a9 100%);
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 3px solid #b36a32; outline-offset: 3px; }
button:disabled { cursor: default; }
#meadow {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: -1;
  pointer-events: none;
}
.shell { max-width: 1110px; margin: 0 auto; padding: 24px 25px 32px; }
.mast {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 18px;
  padding: 0 0 19px;
}
.brand { display: flex; align-items: center; gap: 15px; }
.brand-icon {
  width: 64px;
  height: 64px;
  border-radius: 20px 20px 20px 9px;
  background: #f5e9b8;
  border: 2px solid #959d68;
  box-shadow: 0 4px 0 #a5aa7e, inset 0 2px 0 #fff4d4;
  flex-shrink: 0;
}
h1, h2, p { margin: 0; }
.brand-name { font-family: var(--serif); font-size: clamp(27px, 4.4vw, 47px); letter-spacing: .075em; font-weight: 900; line-height: 1.12; }
.subtitle { color: var(--muted); font-size: 14px; margin-top: 7px; letter-spacing: .07em; }
.trip-progress {
  display: flex;
  align-items: center;
  gap: 9px;
  padding: 7px 13px;
  border: 2px solid #a99263;
  border-radius: 25px;
  background: #fff1bf;
  color: #644625;
  box-shadow: 0 3px 0 #b9a678, inset 0 2px 0 #fff8dc;
  font-size: 14px;
  font-weight: 730;
  white-space: nowrap;
}
.star-icon { color: #efb957; -webkit-text-stroke: 1px #9b571e; font-size: 23px; line-height: 1; }
.mast-actions { display: flex; align-items: center; gap: 9px; flex-shrink: 0; }
.shell[data-screen="home"] .mast { justify-content: flex-end; padding-bottom: 13px; }
.shell[data-screen="home"] .brand,
.shell[data-screen="home"] .trip-progress { display: none; }
.home-cover {
  position: relative;
  display: grid;
  grid-template-columns: minmax(280px, .9fr) minmax(0, 1.2fr);
  min-height: min(575px, 77vh);
  background: #fff3d1;
}
.cover-copy {
  display: grid;
  justify-items: start;
  align-content: center;
  gap: 16px;
  padding: clamp(25px, 5vw, 57px);
}
.home-sprout { width: 69px; height: 69px; background: #e7e6ae; border-radius: 24px; border: 1px solid #a8a674; }
.home-title { font: 900 clamp(48px, 7vw, 88px)/1.08 var(--serif); letter-spacing: .045em; color: #384e37; }
.home-lede { max-width: 16em; color: #566748; font-size: clamp(16px, 1.9vw, 21px); line-height: 1.65; }
.home-action { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; }
.home-action .action { min-height: 47px; padding-inline: 21px; font-size: 17px; }
.home-count { color: #695b40; font-size: 14px; }
.cover-scene {
  min-height: 285px;
  position: relative;
  isolation: isolate;
  border-left: 2px solid #9da870;
  background: #bac786;
  overflow: hidden;
}
.cover-scene img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 42% center; }
.cover-scene::after { content: ""; position: absolute; inset: 0; background: linear-gradient(0deg, #6174467d, transparent 38%); }
.cover-friends {
  position: absolute;
  z-index: 1;
  inset: auto 7% 7%;
  display: flex;
  align-items: flex-end;
  justify-content: center;
}
.cover-friend { display: block; width: min(35%, 170px); height: auto; margin-inline: -3%; filter: drop-shadow(0 4px 4px #56613e45); }
.cover-friend:nth-child(2) { transform: translateY(13%) rotate(-4deg); }
.cover-friend:nth-child(3) { transform: rotate(6deg); }
.portfolio-back { color: #506748; font-size: 14px; text-underline-offset: 4px; }
.layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(255px, .97fr); gap: 14px; align-items: start; }
.paper {
  background: #fff5d9;
  border: 2px solid #a59d70;
  border-radius: 20px;
  box-shadow: 0 5px 0 #858a5c53, inset 0 2px 0 #fffbe9, 0 13px 25px #4a492417;
  overflow: hidden;
}
.play { padding: 14px; }
.stage-header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 12px; }
.stage-name { display: flex; align-items: center; gap: 11px; min-width: 0; }
.stage-number {
  border-radius: 11px;
  border: 2px solid #8f9b63;
  color: #3f573c;
  background: #dce6ae;
  box-shadow: 0 2px 0 #a4a875;
  display: grid;
  place-items: center;
  width: 44px;
  height: 42px;
  font: 700 19px var(--serif);
  flex-shrink: 0;
}
h2 { font: 800 24px/1.25 var(--serif); letter-spacing: .045em; }
.stage-sub { font-size: 13px; color: var(--muted); margin-top: 3px; line-height: 1.45; }
.move-meter {
  display: grid;
  justify-items: center;
  background: #ffe9b5;
  border: 1px solid #d0aa6c;
  box-shadow: 0 2px 0 #dec290;
  border-radius: 11px;
  padding: 3px 10px 5px;
  color: #715334;
  font-size: 12px;
  line-height: 1.12;
  white-space: nowrap;
}
.move-meter strong { font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.move-meter.low { background: #f8d7bf; color: #8b412b; }
.chapter-label { color: #61724e; font-size: 12px; font-weight: 750; margin-bottom: 3px; }
.yard {
  position: relative;
  display: grid;
  place-items: center;
  height: clamp(385px, 53vh, 515px);
  border-radius: 14px;
  overflow: hidden;
  isolation: isolate;
  border: 2px solid #667451;
  background: radial-gradient(ellipse at 50% 45%, #9cab73, #819561 72%, #6d8652);
  box-shadow: inset 0 0 22px #263e2e35;
}
.yard[data-chapter="creek"] {
  background: radial-gradient(ellipse at 49% 44%, #a6b98b, #83a280 68%, #6f8971);
}
#garden { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
.board {
  --gap: 5px;
  --size: 360px;
  --steps: 5;
  --cols: 5;
  --rows: 5;
  --cell: calc((var(--size) - (var(--steps) - 1) * var(--gap)) / var(--steps));
  --pitch: calc(var(--cell) + var(--gap));
  display: grid;
  grid-template: repeat(var(--rows), var(--cell)) / repeat(var(--cols), var(--cell));
  gap: var(--gap);
  position: relative;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  border-radius: 14px;
  z-index: 1;
}
.board::before {
  position: absolute;
  content: "";
  inset: -10px;
  border-radius: 17px;
  background: #506441;
  box-shadow: 0 5px 0 #3d523b, 0 14px 26px #243c2b65, inset 0 0 0 1px #aabb7b72;
  pointer-events: none;
  z-index: -1;
}
.cell {
  position: relative;
  padding: 0;
  border: 1px solid #62754d70;
  border-radius: 8px;
  background: var(--tile, #bdcb87);
  box-shadow: inset 0 1px 1px #f9f6c180, inset 0 -2px 0 #63754635;
  touch-action: none;
}
.cell::before {
  position: absolute;
  content: "";
  width: 6px;
  height: 3px;
  border-radius: 50%;
  background: #63754a48;
  top: var(--fleck-y, 73%);
  left: var(--fleck-x, 20%);
  transform: rotate(-20deg);
  box-shadow: 7px -2px 0 -1px #7b84555e, 22px 4px 0 -1px #e6efac9e;
  pointer-events: none;
}
.cell[data-kind="rock"] { --tile: #99a47b; cursor: default; }
.cell[data-kind="pond"] { --tile: #70a6a1; cursor: default; }
.cell[data-kind="lamp"] { --tile: #c8bd76; cursor: default; }
.cell[data-kind="flowers"] { --tile: #cdb38b; cursor: default; }
.cell[data-kind="floor"]:hover { filter: brightness(1.04); }
.cell.target::after {
  content: "";
  position: absolute;
  width: 17%;
  aspect-ratio: 1;
  inset: 0;
  margin: auto;
  border-radius: 50%;
  background: #617843c7;
  border: 2px solid #f9f7c780;
}
.cell.target:hover::after { background: #334d32; }
.cell.selected {
  outline: 3px solid #fff2ab;
  outline-offset: -4px;
  box-shadow: inset 0 0 0 5px #647246;
}
.cell.suggested { outline: 2px dashed #fff8cc; outline-offset: -4px; animation: beacon 1.1s infinite alternate; }
@keyframes beacon { to { box-shadow: inset 0 0 12px #fff3a9; } }
.sprite { display: block; width: 100%; height: 100%; pointer-events: none; }
.token {
  position: absolute;
  inset: 0 auto auto 0;
  width: var(--cell);
  height: var(--cell);
  transform: translate(calc(var(--x) * var(--pitch)), calc(var(--y) * var(--pitch)));
  transition: transform 180ms cubic-bezier(.22,.72,.22,1);
  pointer-events: none;
  z-index: 2;
}
.token .sprite {
  position: relative;
  width: 91%;
  height: 91%;
  margin: 3% auto 0;
  transition: translate 150ms ease-out;
}
.token.selected { z-index: 3; }
.token.selected::before {
  content: "";
  position: absolute;
  inset: auto 12% 11%;
  height: 26%;
  border: 2px solid #fff2ab;
  border-radius: 50%;
  background: #f4df7f85;
  box-shadow: 0 0 0 1px #586745, 0 0 10px #fff0abc9;
  animation: selection-ring 360ms ease-out;
}
.token.selected .sprite {
  translate: 0 -7%;
  filter: drop-shadow(0 0 2px #fff0bc);
  animation: selection-hop 310ms cubic-bezier(.22,.72,.28,1);
}
@keyframes selection-hop {
  45% { transform: translateY(-10%) scale(1.11); }
  75% { transform: translateY(2%) scale(.98); }
  100% { transform: none; }
}
@keyframes selection-ring {
  from { opacity: .35; transform: scale(.65); }
  65% { opacity: 1; transform: scale(1.1); }
  to { transform: scale(1); }
}
.token.invalid .sprite { animation: shake 220ms ease-out; }
@keyframes shake { 25%, 75% { transform: translateX(-3px); } 50% { transform: translateX(4px); } }
.mood {
  position: absolute;
  top: 5%;
  right: 4%;
  display: grid;
  place-items: center;
  width: max(15px, 25%);
  height: max(15px, 25%);
  border-radius: 50%;
  background: #fff2c9;
  color: #805836;
  border: 1px solid #b5885299;
  font-size: clamp(9px, 1.5vw, 13px);
  font-weight: 900;
}
.token.happy .mood { background: #f2f0c4; color: #325a3d; border-color: #58725488; }
.tools {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
  margin-top: 11px;
}
.action {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  min-height: 39px;
  padding: 0 11px;
  border: 1px solid #c5ad75;
  border-radius: 11px;
  background: #fff0c8;
  box-shadow: 0 3px 0 #c8b184, inset 0 2px 0 #fff8e5;
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
}
.action:hover:not(:disabled) { background: #f9e2a9; }
.action:active:not(:disabled) { transform: translateY(2px); box-shadow: 0 1px 0 #b7aa7b; }
.action:disabled { opacity: .44; }
.action.main { background: #68804c; border-color: #526441; color: #fffbed; box-shadow: 0 3px 0 #4c623f, inset 0 2px 0 #a2b17a; }
.action.main:hover:not(:disabled) { background: #567043; }
.sign { font: 700 16px/1 system-ui, sans-serif; }
.instructions { font-size: 13px; color: var(--muted); line-height: 1.6; margin: 11px 0 0; min-height: 1.6em; }
.instructions.hint { color: #7e5126; }
.sidebar { display: grid; gap: 12px; }
.wishes, .goals { padding: 14px; }
.section-header { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.section-header h2 { font-size: 21px; }
.count {
  background: #e9eed6;
  color: #3c5b3a;
  border: 1px solid #d3ddba;
  border-radius: 20px;
  padding: 4px 9px;
  font-size: 13px;
  white-space: nowrap;
}
.why { color: var(--muted); font-size: 13px; line-height: 1.55; margin: -3px 0 11px; }
.wish-list { display: grid; gap: 6px; }
.wish {
  position: relative;
  display: grid;
  grid-template-columns: 41px minmax(0,1fr) 24px;
  gap: 9px;
  align-items: center;
  width: 100%;
  text-align: left;
  padding: 6px 8px;
  border: 1px solid #ddcba0;
  border-radius: 11px;
  background: #fff2d1;
  min-height: 51px;
}
.wish:hover { background: #f5ebcc; }
.wish.happy { border-color: #dce4c3; background: #f1f2dc; }
.wish.chosen { box-shadow: inset 0 0 0 1px #8d9b69; }
.portrait { display: block; width: 41px; height: 41px; border-radius: 12px; background: var(--wash, #f3dfb9); }
.wish strong, .level strong { display: block; font-size: 14px; }
.wish small { display: block; margin-top: 3px; font-size: 12px; color: var(--muted); line-height: 1.35; }
.wish-status {
  width: 22px;
  height: 22px;
  border-radius: 50%;
  display: grid;
  place-items: center;
  background: #f0e2bd;
  color: #795933;
  font-weight: 800;
  font-size: 12px;
}
.wish.happy .wish-status { color: #36583e; background: #dce7c2; }
.goals .section-header { margin-bottom: 8px; }
.goal-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 3px 0; }
.goal-row strong { color: #5f5439; font-size: 13px; font-variant-numeric: tabular-nums; }
.stars {
  display: inline-flex;
  gap: .08em;
  font-size: 16px;
  line-height: 1;
  white-space: nowrap;
  color: #b2975f;
}
.stars .lit { color: #ecaf49; -webkit-text-stroke: .65px #985c24; }
.map-screen { display: grid; gap: 13px; }
.world-frame { padding: 10px; }
.world-header { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 4px 8px 9px; }
.world-header small { color: var(--muted); text-align: right; font-size: 13px; }
.world-stage {
  position: relative;
  isolation: isolate;
  aspect-ratio: 3 / 2;
  overflow: hidden;
  border: 2px solid #788b62;
  border-radius: 13px;
  background: #c3d096;
}
.world-art { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.world-pin {
  --pin-face: #fff3c9;
  --pin-edge: #8e9167;
  position: absolute;
  z-index: 3;
  left: var(--point-x);
  top: var(--point-y);
  transform: translate(-50%, -50%);
  display: grid;
  justify-items: center;
  gap: 3px;
  padding: 0;
  border: 0;
  border-radius: 13px;
  background: transparent;
  color: #394b34;
}
.world-pin[data-place="creek"] { --pin-face: #ece9d6; --pin-edge: #82936e; }
.world-pin[data-place="mail"] { --pin-face: #f7dfb3; --pin-edge: #aa8757; }
.pin-badge {
  position: relative;
  width: clamp(39px, 6.6vw, 73px);
  aspect-ratio: 1;
  border-radius: 50%;
  background: var(--pin-face);
  border: 2px solid var(--pin-edge);
  box-shadow: 0 4px 0 #475f3d60, inset 0 2px 0 #fff8e2;
  transition: transform .18s ease-out;
}
.pin-badge::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: -4px;
  width: 8px;
  height: 8px;
  transform: translateX(-50%) rotate(45deg);
  background: var(--pin-face);
  border-right: 2px solid var(--pin-edge);
  border-bottom: 2px solid var(--pin-edge);
}
.pin-name {
  line-height: 1.3;
  border: 1px solid #9aa379;
  border-radius: 9px;
  background: #fff8df;
  box-shadow: 0 2px 0 #53704a5c;
  padding: 3px 8px;
  font-size: clamp(12px, 1.7vw, 18px);
  font-weight: 850;
  white-space: nowrap;
}
.pin-state {
  position: absolute;
  z-index: 1;
  top: -5px;
  right: -6px;
  min-width: 23px;
  border: 1px solid #9c744e;
  border-radius: 15px;
  background: #ffedbb;
  color: #714523;
  box-shadow: 0 1px 0 #8c623763;
  font-size: 12px;
  padding: 2px 4px;
  line-height: 1.15;
}
.world-pin:hover .pin-badge, .world-pin[aria-pressed="true"] .pin-badge { transform: translateY(-4px); }
.world-pin[aria-pressed="true"] .pin-name { background: #ffe8ac; border-color: #977442; }
.world-pin.locked .pin-badge { filter: saturate(.65); }
.world-addition {
  position: absolute;
  z-index: 2;
  left: var(--point-x);
  top: var(--point-y);
  transform: translate(-50%, -50%);
  width: 17%;
  margin: 0;
  display: grid;
  justify-items: center;
  animation: map-arrive .5s cubic-bezier(.2,.75,.32,1.15) both;
  pointer-events: none;
}
.world-addition canvas { width: 100%; height: auto; display: block; }
.world-addition figcaption {
  margin-top: -4%;
  padding: 2px 5px;
  border-radius: 7px;
  background: #fff4d8eb;
  color: #4b5b3c;
  font-size: clamp(10px, 1.3vw, 13px);
  white-space: nowrap;
}
@keyframes map-arrive {
  from { opacity: 0; transform: translate(-50%, -44%) scale(.88); }
  to { opacity: 1; transform: translate(-50%, -50%) scale(1); }
}
.map-notice {
  border: 1px solid #adb985;
  background: #eef0cd;
  border-radius: 10px;
  margin-top: 8px;
  padding: 8px 11px;
  color: #485e3f;
  font-size: 14px;
}
.chapter-dock { padding: 11px; }
.chapter {
  min-width: 0;
  padding: 9px;
  border: 1px solid #b8c394;
  border-radius: 14px;
  background: #e8ecc5;
}
.chapter[data-region="creek"] { background: #e1eee0; border-color: #aec5ab; }
.chapter-header { display: flex; align-items: center; gap: 7px; margin-bottom: 6px; }
.chapter-icon { width: 34px; height: 34px; flex-shrink: 0; }
.chapter-info { flex: 1; min-width: 0; }
.chapter-info strong { display: block; color: #3e5438; font-size: 15px; }
.chapter-info small { display: block; color: #546747; font-size: 12px; margin-top: 2px; }
.level-list { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 5px; }
.level {
  display: grid;
  place-items: center;
  gap: 3px;
  min-height: 59px;
  min-width: 0;
  padding: 5px 0;
  border: 1px solid #acb883;
  border-radius: 10px;
  background: #f7f1d4;
  box-shadow: 0 2px 0 #aeb686;
}
.level[aria-current="step"] { background: #ffedb4; border-color: #a7874f; box-shadow: 0 2px 0 #b89c63; }
.level:hover:not(:disabled):not([aria-current="step"]) { background: #fff5d3; }
.level:disabled { opacity: .64; background: #e8ecdf; }
.level-num { font-size: 13px; font-weight: 800; color: #546347; }
.level.earned .level-num::after {
  content: "";
  display: inline-block;
  width: 8px;
  height: 8px;
  margin-left: 3px;
  border: 1px solid #5b794c;
  border-radius: 8px 0 8px 0;
  background: #a1b96d;
}
.level strong { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 12px; }
.level .stars { font-size: 12px; }
.mail-intro { margin-bottom: 9px; }
.mail-list { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.mail-card {
  min-width: 0;
  display: grid;
  align-content: start;
  gap: 6px;
  padding: 11px;
  border: 1px solid #d5bf90;
  border-radius: 13px;
  background: #fff1cf;
}
.mail-card.read { border-color: #b4c080; background: #f0efcc; }
.mail-from { color: #766443; font-size: 12px; font-weight: 750; }
.mail-card h3 { margin: 0; font-family: var(--serif); font-size: 18px; }
.mail-letter { min-height: 3em; color: var(--muted); font-size: 13px; line-height: 1.55; }
.mail-state { min-height: 1.4em; color: #6b5a3b; font-size: 12px; line-height: 1.4; }
.mail-card .action { width: fit-content; }
.sidebar-note { color: var(--muted); margin: 8px 0 0; font-size: 12px; line-height: 1.5; }
.challenge-bar { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-top: 11px; }
.challenge-bar .sidebar-note { margin: 0; }
.challenge-bar .action { min-height: 34px; padding-inline: 9px; font-size: 13px; }
.win-wrap {
  display: grid;
  place-items: center;
  position: absolute;
  inset: 0;
  z-index: 5;
  padding: 15px;
  background: #203c2d66;
}
.win-wrap[hidden] { display: none; }
.win-card {
  max-width: 295px;
  width: 100%;
  padding: 22px 18px 18px;
  text-align: center;
  background: #fff8e2;
  border: 1px solid #ddca9b;
  border-radius: 17px;
  box-shadow: 0 5px 0 #a8996588, 0 14px 42px #203c2d73;
  animation: settle .26s ease-out both;
}
@keyframes settle { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.win-card canvas { width: 55px; height: 55px; margin: -5px auto 4px; display: block; }
.win-card p { color: var(--muted); margin: 8px 0 15px; font-size: 14px; line-height: 1.55; }
.win-stars .stars { font-size: 31px; margin-top: 8px; }
.win-stars .lit { animation: medal-pop .35s cubic-bezier(.2,.75,.32,1.2) both; }
.win-stars .lit:nth-child(2) { animation-delay: 70ms; }
.win-stars .lit:nth-child(3) { animation-delay: 140ms; }
@keyframes medal-pop { from { opacity: 0; transform: scale(.5); } to { opacity: 1; transform: scale(1); } }
.win-actions { display: flex; gap: 7px; justify-content: center; flex-wrap: wrap; }
.next { margin-left: auto; }
.next[hidden] { display: none; }
[hidden] { display: none; }
@media (max-width: 790px) {
  .shell { padding-inline: 17px; }
  .layout { gap: 12px; grid-template-columns: minmax(0,1.65fr) minmax(238px,1fr); }
  .play { padding: 14px; }
  .sidebar { gap: 12px; }
  .wishes { padding: 13px; }
  .yard { height: 390px; }
  .mail-list { grid-template-columns: minmax(0, 1fr); }
  .mail-letter { min-height: 0; }
}
@media (max-width: 635px) {
  .shell { max-width: 485px; padding: 18px 12px 22px; }
  .mast { gap: 8px; padding-bottom: 17px; }
  .brand { gap: 10px; }
  .brand-icon { width: 48px; height: 48px; border-radius: 14px 14px 14px 7px; }
  .subtitle { letter-spacing: 0; font-size: 12px; margin-top: 4px; }
  .trip-progress { gap: 5px; padding: 4px 8px; font-size: 12px; }
  .mast-actions { gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
  .star-icon { font-size: 19px; }
  .layout { grid-template-columns: minmax(0, 1fr); }
  .play { padding: 12px; }
  .stage-header { margin-bottom: 11px; }
  .stage-name { gap: 8px; }
  .stage-number { height: 35px; width: 35px; }
  .move-meter { padding-inline: 7px; }
  .move-meter strong { font-size: 21px; }
  h2 { font-size: 21px; }
  .yard { height: clamp(265px, 89vw, 373px); min-height: 0; }
  .board { --gap: 4px; }
  .tools { gap: 5px; }
  .action { min-height: 36px; padding-inline: 8px; font-size: 13px; }
  .home-cover { grid-template-columns: minmax(0, 1fr); }
  .cover-copy { gap: 10px; padding: 22px; }
  .home-sprout { width: 51px; height: 51px; border-radius: 16px; }
  .cover-scene { min-height: 235px; border-left: 0; border-top: 2px solid #9da870; }
  .level strong { font-size: 11px; }
  .world-frame { padding: 6px; }
  .world-header { padding-inline: 3px; }
  .world-header small { font-size: 11px; }
  .pin-name { padding-inline: 4px; }
  .world-addition { width: 20%; }
  .world-addition figcaption { display: none; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 1ms !important; transition-duration: 1ms !important; }
}
</style>
</head>
<body>
<canvas id="meadow" aria-hidden="true"></canvas>

    <div class="brand">
      <canvas class="brand-icon" id="logo" width="128" height="128" aria-hidden="true"></canvas>

      <div class="trip-progress">

<script>
"use strict";

const byId = id => document.getElementById(id);
const darkInk = "#423d2e";

function randomFrom(seed) {
  let state = seed >>> 0;
  return () => {
    state = (Math.imul(state, 1664525) + 1013904223) >>> 0;
    return state / 4294967296;
  };
}

function oval(ctx, x, y, rx, ry, fill, stroke, angle = 0) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, angle, 0, Math.PI * 2);
  if (fill) { ctx.fillStyle = fill; ctx.fill(); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(); }
}
function shape(ctx, path, fill, stroke) {
  const outline = new Path2D(path);
  if (fill) { ctx.fillStyle = fill; ctx.fill(outline); }
  if (stroke) { ctx.strokeStyle = stroke; ctx.stroke(outline); }
}

function face(ctx, x, y, width, happy) {
  for (const offset of [-1, 1]) {
    const eye = x + width * offset;
    if (happy) {
      shape(ctx, `M ${eye - 3} ${y + 1} q 3 -6 6 0`, null, darkInk);
    } else {
      oval(ctx, eye, y, 1.75, 2.35, darkInk);
    }
  }
}
function grass(ctx, x, y, s, color) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  shape(ctx, "M0 0 Q-6 -7 -6 -10 Q-1 -9 2 0 Q1 -12 4 -13 Q7 -10 4 1 Q10 -9 13 -8 Q10 -3 5 1 Z", color);
  ctx.restore();
}
function bloom(ctx, x, y, s, petals, leaf = "#5a754d") {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(s, s);
  ctx.lineWidth = 1.35;
  shape(ctx, "M0 9 Q-1 17 1 26 M1 22 Q-2 16 -8 16 M0 19 Q3 15 7 15", null, leaf);
  for (let i = 0; i < 5; i++) {
    const angle = i * Math.PI * 2 / 5;
    oval(ctx, Math.sin(angle) * 3.2, 4 + Math.cos(angle) * 3.2, 2.4, 3.2, petals, null, -angle);
  }
  oval(ctx, 0, 4, 2.05, 2.05, "#b87442");
  ctx.restore();
}

  sprout(ctx) {
    oval(ctx, 50, 76, 26, 11, "#acb788");

const sprites = new Map();
function spriteSource(kind, happy = false, variant = false) {

  if (sprites.has(key)) return sprites.get(key);
  const canvas = document.createElement("canvas");
  canvas.width = canvas.height = 160;
  const ctx = canvas.getContext("2d");
  ctx.scale(1.6, 1.6);
  ctx.lineWidth = 1.85;
  ctx.lineCap = ctx.lineJoin = "round";
  art[kind](ctx, happy, variant);
  ctx.globalCompositeOperation = "source-atop";
  const random = randomFrom(1167);

    ctx.fillStyle = i % 2 ? "#fff8d52d" : "#453b291d";
    ctx.fillRect(random() * 100, random() * 100, .58, .48);
  }
  sprites.set(key, canvas);
  return canvas;
}
function paintSprite(canvas, kind, happy = false, variant = false) {
  const ctx = canvas.getContext("2d");
  ctx.clearRect(0, 0, canvas.width, canvas.height);

}
function newSprite(className = "sprite") {
  const canvas = document.createElement("canvas");

  canvas.className = className;
  canvas.setAttribute("aria-hidden", "true");
  return canvas;
}

function sizeCanvas(canvas) {
  const rect = canvas.getBoundingClientRect();
  const ratio = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = Math.round(rect.width * ratio);
  canvas.height = Math.round(rect.height * ratio);
  const ctx = canvas.getContext("2d");
  ctx.scale(ratio, ratio);
  ctx.lineCap = ctx.lineJoin = "round";
  return [ctx, rect.width, rect.height];
}

  const [ctx, width, height] = sizeCanvas(byId("meadow"));
  const random = randomFrom(503);
  for (let i = 0; i < width * height / 130; i++) {
    ctx.fillStyle = i % 2 ? "#786c431c" : "#fff8d87b";
    ctx.fillRect(random() * width, random() * height, 1 + random(), .7);
  }
  for (const side of [0, 1]) {
    for (let i = 0; i < 28; i++) {
      const inset = random() * Math.min(width * .18, 190);
      const x = side ? width - inset : inset;
      const y = height * (.74 + random() * .29);

  }
}

function adjacency(level, index, dx, dy) {
  const x = index % level.width + dx;
  const y = Math.floor(index / level.width) + dy;
  return x >= 0 && x < level.width && y >= 0 && y < level.height ? y * level.width + x : -1;
}
function compileLevel(chapter, [title, note, rows, par, limit], number) {
  const level = { chapter, number, title, note, par, limit, width: rows[0].length, height: rows.length, actors: [], start: [] };
  const seenKinds = new Set();
  level.terrain = [...rows.join("")].map((cell, index) => {
    if (!kinds[cell]) return tileKinds[cell];
    const { name, alternate, ...kind } = kinds[cell];
    const variant = seenKinds.has(cell);
    seenKinds.add(cell);
    level.actors.push({ ...kind, type: cell, variant, name: variant && alternate ? alternate : name });
    level.start.push(index);
    return "floor";
  });
  level.near = level.terrain.map((_, index) => directions
    .map(([dx, dy]) => adjacency(level, index, dx, dy))
    .filter(cell => cell >= 0));
  level.nearMasks = level.near.map(cells => cells.reduce((mask, cell) => mask | (1 << cell), 0));
  const nearProps = level.near.map(cells => cells.map(cell => level.terrain[cell]));
  for (const actor of level.actors) {
    actor.fixedSatisfied = nearProps.map(props =>
      (!actor.props || actor.props.every(prop => props.includes(prop))) &&
      (!actor.rocks || props.filter(prop => prop === "rock").length >= actor.rocks)
    );
  }
  level.rays = level.terrain.map((_, index) => directions.map(([dx, dy]) => {
    const ray = [];
    for (let next = adjacency(level, index, dx, dy); next >= 0 && level.terrain[next] === "floor"; next = adjacency(level, next, dx, dy)) {
      ray.push(next);
    }
    return ray;
  }));
  return level;
}

function masksAt(level, positions) {
  let occupied = 0;
  let ducks = 0;
  for (let i = 0; i < positions.length; i++) {
    const tile = 1 << positions[i];
    occupied |= tile;
    if (level.actors[i].type === "d") ducks |= tile;
  }
  return [occupied, ducks];
}
function isHappy(level, actor, cell, occupied, ducks) {
  const neighbors = level.nearMasks[cell];
  return actor.fixedSatisfied[cell] &&
    (!actor.isolated || !(neighbors & occupied)) &&
    (actor.type !== "d" || Boolean(neighbors & ducks));
}
function openTargets(level, positions, actor) {
  if (actor < 0) return [];
  const [occupied] = masksAt(level, positions);
  const targets = [];
  for (const ray of level.rays[positions[actor]]) {
    for (const cell of ray) {
      if (occupied & (1 << cell)) break;
      targets.push(cell);
    }
  }
  return targets;
}
function solve(level, initial) {
  const count = initial.length;
  const positions = Array(count);
  let start = 0;
  for (let actor = 0; actor < count; actor++) start |= initial[actor] << (5 * actor);
  const visited = new Set([start]);
  const queue = [start];
  const firstMoves = [-1];
  let distance = 0;
  let layerEnd = 1;
  for (let head = 0; head < queue.length; head++) {
    if (head === layerEnd) {
      layerEnd = queue.length;
      distance++;
    }
    const state = queue[head];
    for (let actor = 0; actor < count; actor++) positions[actor] = (state >>> (5 * actor)) & 31;
    const [occupied, ducks] = masksAt(level, positions);
    if (level.actors.every((actor, index) => isHappy(level, actor, positions[index], occupied, ducks))) {
      if (head === 0) return null;
      const encoded = firstMoves[head];
      return { actor: encoded >>> 5, cell: encoded & 31, distance };
    }
    for (let actor = 0; actor < count; actor++) {
      const source = positions[actor];
      for (const ray of level.rays[source]) {
        for (const cell of ray) {
          if (occupied & (1 << cell)) break;
          const next = state ^ ((source ^ cell) << (5 * actor));
          if (visited.has(next)) continue;
          visited.add(next);
          queue.push(next);
          firstMoves.push(head === 0 ? (actor << 5) | cell : firstMoves[head]);
        }
      }
    }
  }
  return null;
}

function playSound(name) {
  const SoundEngine = window.AudioContext || window.webkitAudioContext;
  if (!soundEnabled || !SoundEngine) return;
  try {
    soundContext ??= new SoundEngine();
    const play = () => {
      if (!soundEnabled || soundContext.state !== "running") return;
      const now = soundContext.currentTime + .013;
      for (const [pitch, delay, length, volume, type = "sine", endPitch = pitch] of soundNotes[name]) {
        const starts = now + delay;
        const tone = soundContext.createOscillator();
        const envelope = soundContext.createGain();
        tone.type = type;
        tone.frequency.setValueAtTime(pitch, starts);
        tone.frequency.exponentialRampToValueAtTime(endPitch, starts + length);
        envelope.gain.setValueAtTime(.0001, starts);
        envelope.gain.exponentialRampToValueAtTime(volume, starts + .012);
        envelope.gain.exponentialRampToValueAtTime(.0001, starts + length);
        tone.connect(envelope);
        envelope.connect(soundContext.destination);
        tone.start(starts);
        tone.stop(starts + length);
      }
    };
    if (soundContext.state === "running") play();
    else soundContext.resume().then(play).catch(() => {});
  } catch {}
}

function updateMap(total) {
  let completed = 0;
  let pending = 0;
  for (const [index, { card, body, state, button }] of mailCards.entries()) {
    const boardIndex = chapterLevels.length + index;
    const letter = letters[index];
    const unlocked = isOpen(boardIndex);
    const done = Boolean(scores[boardIndex]);
    if (done) completed++;
    else if (unlocked) pending++;
    mapLandmarks[index].hidden = !done;
    card.classList.toggle("read", done);
    body.textContent = unlocked ? letter.text
      : total < mailRegion.unlock ? `集满 ${mailRegion.unlock} 星后，打开邻里邮箱。`
      : "完成前一封来信后寄达。";
    state.innerHTML = done
      ? `已添加${letter.reward} ${starsMarkup(starsFor(levels[boardIndex], scores[boardIndex]))}`
      : unlocked ? `完成后添上${letter.reward}` : "";
    button.disabled = !unlocked;
    button.textContent = done ? "再挑战" : unlocked ? "帮个忙" : "还未寄达";
    button.setAttribute("aria-label", `${button.textContent}：${letter.title}`);
  }
  byId("mapStatus").textContent = completed
    ? `来信景物 ${completed} / ${letters.length}` : "点地图上的地点选关";
  byId("mailCount").textContent = `完成 ${completed} / ${letters.length}`;
  byId("mailIntro").textContent = total < mailRegion.unlock
    ? `集满 ${mailRegion.unlock} 星，第一封信就会寄到。`
    : "完成一封来信，地图上就会添一处景物。";
  for (const { place, button, state } of worldPins) {
    const locked = total < place.unlock;
    const cleared = chapterLevels.reduce((count, entry, index) => count + Number(entry.chapter === place && Boolean(scores[index])), 0);
    const pendingText = pending ? `${pending} 封待办` : `完成 ${completed} 封`;
    state.textContent = locked ? `${place.unlock}★`
      : place === mailRegion ? pending || "✓" : `${cleared}/${place.levels.length}`;
    button.classList.toggle("locked", locked);
    button.setAttribute("aria-label", `${place.title}，${locked ? `集满 ${place.unlock} 星解锁` : place === mailRegion ? pendingText : `通关 ${cleared} 处`}`);
  }
}

function updateProgress() {
  const total = totalStars();
  for (const [index, button] of levelButtons.entries()) {
    const entry = levels[index];

    const unlocked = total >= entry.chapter.unlock;
    button.querySelector(".rank").innerHTML = starsMarkup(stars);
    button.disabled = !unlocked;
    button.classList.toggle("earned", stamps[index]);
    const record = scores[index] ? `，最佳 ${scores[index]} 步` : "，尚未通关";
    button.setAttribute("aria-label", `第 ${entry.number} 关，${entry.title}，${stars} 星${record}${stamps[index] ? "，已获叶章" : ""}`);
    button.title = unlocked ? `${entry.title}${record}${stamps[index] ? "，已获叶章" : ""}` : `集满 ${entry.chapter.unlock} 星解锁`;

  for (const { chapter, status } of chapterCards) {
    const chapterStars = levels.reduce((total, entry, index) => entry.chapter === chapter ? total + starsFor(entry, scores[index]) : total, 0);
    status.textContent = total >= chapter.unlock
      ? `已收集 ${chapterStars} / ${chapter.levels.length * 3} 星`

}

    board.append(button);
    return button;
  });

  byId("wishList").replaceChildren();
  tokens = [];
  wishes = [];
  for (const [index, actor] of level.actors.entries()) {
    const token = document.createElement("div");
    token.className = "token";
    token.setAttribute("aria-hidden", "true");
    const sprite = newSprite();
    const mood = document.createElement("span");
    mood.className = "mood";
    token.append(sprite, mood);
    board.append(token);
    tokens.push({ token, sprite, mood, happy: null });

    const wish = document.createElement("button");
    wish.className = "wish";
    wish.type = "button";
    wish.style.setProperty("--wash", actor.wash);
    const portrait = newSprite("portrait");
    const detail = document.createElement("span");
    detail.innerHTML = `<strong>${actor.name} · ${actor.label}</strong><small>${actor.wish}</small>`;
    const status = document.createElement("span");
    status.className = "wish-status";
    status.setAttribute("aria-hidden", "true");
    wish.append(portrait, detail, status);
    wish.addEventListener("click", () => {
      if (outcome !== "playing") return;
      select(index);
      cells[positions[index]].focus({ preventScroll: true });
    });
    byId("wishList").append(wish);
    wishes.push({ wish, portrait, status });
  }
  resizeBoard();
  updateProgress();
  message(instructionText);
  render();
  return true;
}

function resizeBoard() {
  const width = yard.clientWidth;
  const height = yard.clientHeight;
  const margin = width > 470 ? 77 : 45;
  board.style.setProperty("--size", `${Math.max(1, Math.min(448, width - margin, height - 44))}px`);
  drawGarden(current);
}

function render() {
  const [occupied, ducks] = masksAt(level, positions);
  const happy = level.actors.map((actor, index) => isHappy(level, actor, positions[index], occupied, ducks));
  const playing = outcome === "playing";
  const targets = new Set(playing ? openTargets(level, positions, selected) : []);
  for (const [index, cell] of cells.entries()) {
    const actorIndex = positions.indexOf(index);
    const piece = level.actors[actorIndex];
    const tile = level.terrain[index];
    const coord = `第 ${Math.floor(index / level.width) + 1} 行第 ${index % level.width + 1} 列`;
    const label = piece
      ? `${piece.name}，${piece.label}，${happy[actorIndex] ? "已满足" : "等待安顿"}`
      : tileNames[tile];
    cell.classList.toggle("selected", actorIndex >= 0 && actorIndex === selected && playing);
    cell.classList.toggle("target", targets.has(index));
    cell.classList.toggle("suggested", index === suggestion);
    cell.setAttribute("aria-label", `${coord}，${label}${targets.has(index) ? "，可移动到这里" : ""}`);
  }
  for (const [index, actor] of level.actors.entries()) {
    const { token, sprite, mood } = tokens[index];
    const { wish, portrait, status } = wishes[index];
    const at = positions[index];
    token.style.setProperty("--x", at % level.width);
    token.style.setProperty("--y", Math.floor(at / level.width));
    token.classList.toggle("selected", selected === index && playing);
    wish.classList.toggle("chosen", selected === index && playing);
    if (happy[index] !== tokens[index].happy) {
      paintSprite(sprite, actor.art, happy[index], actor.variant);
      paintSprite(portrait, actor.art, happy[index], actor.variant);
      token.classList.toggle("happy", happy[index]);
      wish.classList.toggle("happy", happy[index]);
      mood.textContent = status.textContent = happy[index] ? "✓" : "·";
      wish.setAttribute("aria-label", `${actor.name}，${actor.wish}，${happy[index] ? "已满足" : "未满足"}`);
      tokens[index].happy = happy[index];
    }
    wish.setAttribute("aria-pressed", String(selected === index && playing));
  }
  const satisfied = happy.filter(Boolean).length;
  byId("wishCount").textContent = `已满足 ${satisfied} / ${positions.length}`;
  const remaining = moveLimit() - history.length;
  byId("moves").textContent = remaining;
  byId("moveMeter").classList.toggle("low", remaining < 3 && outcome !== "won");
  byId("undo").disabled = challenge || history.length === 0;
  byId("hint").disabled = challenge || !playing;
  byId("next").hidden = playing;
  byId("next").textContent = buttonText();
  return satisfied === positions.length;
}

function select(actor, audible = true) {
  if (outcome !== "playing") return;
  selected = actor;
  suggestion = -1;
  if (actor >= 0 && audible) playSound("pick");
  message(actor >= 0 ? `${level.actors[actor].name}可以沿直线移动到亮点。` : instructionText);
  render();
}

function invalidMove() {
  playSound("stop");
  message("只能沿直线滑动，石头、设施和其他动物会挡路。", true);
  if (selected < 0) return;
  const token = tokens[selected].token;
  token.classList.remove("invalid");
  requestAnimationFrame(() => token.classList.add("invalid"));
  token.addEventListener("animationend", () => token.classList.remove("invalid"), { once: true });
}
function move(actor, cell, focusCell = false) {
  if (actor < 0 || outcome !== "playing" || cell === positions[actor]) return;
  if (!openTargets(level, positions, actor).includes(cell)) {
    invalidMove();
    return;
  }
  history.push({ actor, from: positions[actor] });
  positions[actor] = cell;
  selected = actor;
  suggestion = -1;
  message(instructionText);
  const done = render();
  if (done) finish();
  else if (history.length === moveLimit()) fail();
  else {
    playSound("slide");
    if (focusCell) cells[cell].focus({ preventScroll: true });
  }
}

function focusBoard() {
  cells[positions[0]].focus({ preventScroll: true });
  const top = yard.getBoundingClientRect().top;
  if (top < 0 || top > window.innerHeight - 160) {
    document.querySelector(".play").scrollIntoView({ block: "start" });
  }
}

function showScreen(screen) {
  byId("gameShell").dataset.screen = screen;
  byId("homeScreen").hidden = screen !== "home";
  byId("mapScreen").hidden = screen !== "map";
  byId("playScreen").hidden = screen !== "play";
  byId("homeBack").hidden = screen !== "map";
  byId("mapBack").hidden = screen !== "play";
}

function enterBoard(index) {
  if (!isOpen(index)) return;
  showScreen("play");
  playSound("pick");
  if (index === current && outcome === "playing" && !challenge) resizeBoard();
  else loadLevel(index);
  focusBoard();
}

function showMap(place = level.chapter.id, arrival = "", focus = true) {
  hideWin();
  showScreen("map");
  choosePlace(place);
  const notice = byId("mapNotice");
  notice.textContent = arrival;
  notice.hidden = !arrival;
  if (focus) byId("levelsTitle").focus();
}

function advance() {
  if (outcome === "failed") {
    loadLevel(current, challenge);
    focusBoard();
  } else if (challenge) {
    loadLevel(current);
    focusBoard();
  } else if (level.letter) {
    showMap(mailRegion.id, level.letter.arrival);
  } else if (current + 1 < chapterLevels.length && isOpen(current + 1)) {
    loadLevel(current + 1);
    focusBoard();
  } else {
    showMap();
  }
}

function showResult(title, note, stars = 0) {
  selected = -1;
  suggestion = -1;
  render();
  byId("winTitle").textContent = title;
  byId("winNote").textContent = note;
  byId("winStars").innerHTML = stars ? starsMarkup(stars) : "";
  byId("winNext").textContent = buttonText();
  byId("viewBoard").textContent = outcome === "failed" && !challenge ? "撤回一步" : "看看棋盘";
  byId("win").hidden = false;
  board.inert = true;
  document.querySelector(".tools").inert = true;
  document.querySelector(".sidebar").inert = true;
  byId("mapBack").inert = true;
  byId("soundToggle").inert = true;
  byId("winNext").focus({ preventScroll: true });
}

function finish() {
  outcome = "won";
  const steps = history.length;
  const before = totalStars();
  let title = "住客都安顿好了";
  let note;
  let earned = 0;
  let resultSound = "win";
  if (challenge) {
    const newStamp = !stamps[current];
    if (newStamp) {
      stamps[current] = true;
      saveProgress();
    }
    title = "星光挑战完成";
    note = `${steps} 步通关 · ${newStamp ? "获得一枚叶章" : "这关已收下叶章"}`;
  } else {
    earned = starsFor(level, steps);
    const firstClear = scores[current] === null;
    if (scores[current] === null || steps < scores[current]) {
      scores[current] = steps;
      saveProgress();
    }
    const after = totalStars();
    const opening = chapters.find(chapter => before < chapter.unlock && after >= chapter.unlock);
    note = `本次 ${steps} 步 · 本关纪录 ${scores[current]} 步`;
    if (opening) {
      note += ` · ${opening.title}已解锁，邻里邮箱收到第一封信`;
      resultSound = "mail";
    }
    if (before < challengeGate && after >= challengeGate) note += " · 星光挑战已解锁";
    if (level.letter) {
      title = "来信委托完成";
      if (firstClear) {
        note += ` · 地图新增${level.letter.reward}`;
        resultSound = "mail";
      }
    } else if (chapterLevels.every((entry, index) => starsFor(entry, scores[index]) === 3)) {
      title = "两章都拿到满星了";
    }
  }
  playSound(resultSound);
  updateProgress();
  message("所有心愿都满足了。");
  showResult(title, note, earned);
}

function fail() {
  outcome = "failed";
  playSound("retry");
  const note = challenge ? "再试一次，找找更短的路线。" : "还有住客的心愿没满足。可以撤回一步，或重新来过。";
  message(note, true);
  showResult("步数用完啦", note);
}

function undo() {
  if (challenge || !history.length) return;
  playSound("undo");
  hideWin();
  const { actor, from } = history.pop();
  positions[actor] = from;
  outcome = "playing";
  selected = actor;
  suggestion = -1;
  message("已撤回上一步。");
  render();
}
function hint() {
  if (outcome !== "playing" || challenge) return;
  const next = solve(level, positions);
  if (!next) return;
  if (next.distance > moveLimit() - history.length) {
    message(`从这里至少还要 ${next.distance} 步，可以先撤回或重开。`, true);
    return;
  }
  selected = next.actor;
  suggestion = next.cell;
  const from = positions[selected];
  const delta = suggestion - from;
  const sameRow = Math.floor(from / level.width) === Math.floor(suggestion / level.width);
  const direction = sameRow ? (delta > 0 ? 1 : 3) : (delta > 0 ? 2 : 0);
  const distance = Math.abs(sameRow ? delta : delta / level.width);
  message(`提示：让${level.actors[selected].name}向${directionNames[direction]}滑 ${distance} 格。`, true);
  render();
}

board.addEventListener("click", event => {
  if (outcome !== "playing" || preventClick) return;
  const cell = Number(event.target.closest(".cell")?.dataset.cell);
  if (!Number.isInteger(cell)) return;
  const actor = positions.indexOf(cell);
  if (actor >= 0) select(selected === actor ? -1 : actor);
  else if (selected >= 0) move(selected, cell, true);
});
board.addEventListener("pointerdown", event => {
  preventClick = false;
  if (outcome !== "playing" || !event.isPrimary || event.button !== 0) return;
  const cell = Number(event.target.closest(".cell")?.dataset.cell);
  if (!Number.isInteger(cell)) return;
  const actor = positions.indexOf(cell);
  if (actor < 0) return;
  gesture = { actor, cell, x: event.clientX, y: event.clientY, id: event.pointerId };
});
window.addEventListener("pointerup", event => {
  if (!gesture || gesture.id !== event.pointerId) return;
  const { actor, cell, x, y } = gesture;
  gesture = null;
  const dx = event.clientX - x;
  const dy = event.clientY - y;
  if (Math.max(Math.abs(dx), Math.abs(dy)) < 14) return;
  preventClick = true;
  setTimeout(() => { preventClick = false; }, 0);
  if (outcome !== "playing") return;
  select(actor, false);
  const pitch = cells[1].offsetLeft - cells[0].offsetLeft;
  const alongX = Math.abs(dx) >= Math.abs(dy);
  const amount = Math.round((alongX ? dx : dy) / pitch);
  if (amount === 0) return;
  const destination = adjacency(level, cell, alongX ? amount : 0, alongX ? 0 : amount);
  if (destination >= 0) move(actor, destination, true);
  else invalidMove();
});
window.addEventListener("pointercancel", event => {
  if (gesture?.id === event.pointerId) gesture = null;
});
byId("undo").addEventListener("click", undo);
byId("hint").addEventListener("click", hint);
byId("reset").addEventListener("click", () => loadLevel(current, challenge));
byId("next").addEventListener("click", advance);
byId("winNext").addEventListener("click", advance);
byId("startButton").addEventListener("click", () => {
  playSound("start");
  showMap(mapPlace);
});
byId("homeBack").addEventListener("click", () => {
  playSound("pick");
  showScreen("home");
  byId("startButton").focus();
});
byId("mapBack").addEventListener("click", () => {
  playSound("pick");
  showMap();
});
byId("soundToggle").addEventListener("click", () => {
  soundEnabled = !soundEnabled;
  try { localStorage.setItem(soundKey, soundEnabled ? "on" : "off"); } catch {}
  updateSoundButton();
  if (soundEnabled) playSound("pick");
  else if (soundContext?.state === "running") soundContext.suspend().catch(() => {});
});
function viewBoard() {
  hideWin();
  byId("next").focus({ preventScroll: true });
}
byId("viewBoard").addEventListener("click", () => {
  if (outcome === "failed" && !challenge) {
    undo();
    cells[positions[selected]].focus({ preventScroll: true });
  } else {
    viewBoard();
  }
});
byId("challengeButton").addEventListener("click", () => {
  if (loadLevel(current, !challenge)) focusBoard();
});

document.addEventListener("keydown", event => {
  if (byId("playScreen").hidden) return;
  if (event.altKey || event.ctrlKey || event.metaKey) return;
  if (!byId("win").hidden) {
    if (event.key === "Escape") viewBoard();
    if (event.key === "Tab") {
      event.preventDefault();
      const target = document.activeElement === byId("winNext") ? byId("viewBoard") : byId("winNext");
      target.focus();
    }
    return;
  }
  if (event.key === "Escape") select(-1);
  const key = event.key.toLowerCase();
  if (key === "z") undo();
  if (key === "r") loadLevel(current, challenge);
  if (key === "h") hint();
  const direction = arrows.indexOf(event.key);
  if (direction < 0 || outcome !== "playing") return;
  const focusedCell = Number(document.activeElement?.dataset.cell);
  const focusedActor = positions.indexOf(focusedCell);
  const actor = selected >= 0 ? selected : focusedActor;
  if (actor < 0) return;
  event.preventDefault();
  if (selected !== actor) select(actor);
  const cell = adjacency(level, positions[actor], ...directions[direction]);
  if (openTargets(level, positions, actor).includes(cell)) move(actor, cell, true);
  else invalidMove();
});

paintSprite(byId("logo"), "sprout");
paintSprite(byId("coverSprout"), "sprout");
paintSprite(byId("coverOtter"), "otter", true);
paintSprite(byId("coverDuck"), "duck", true);
paintSprite(byId("coverFrog"), "frog", true);
paintSprite(byId("winSprout"), "sprout");
updateSoundButton();
loadLevel(0);
choosePlace(mapPlace);
showScreen("home");
drawMeadow();
new ResizeObserver(resizeBoard).observe(yard);
window.addEventListener("resize", drawMeadow);
</script>
</body>
</html>
