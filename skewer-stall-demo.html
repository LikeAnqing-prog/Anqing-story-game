adow:0 11px 24px #0004,inset 0 1px #ffffff33}.grillhead,.grillfoot{display:flex;align-items:center;justify-content:space-between;padding:0 5px}.grillhead{margin-bottom:12px}.grillhead strong{font-size:17px;letter-spacing:1px}.grillhead span,.grillfoot{font-size:12px;color:#d1d1bb}.lamp{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff9c66;box-shadow:0 0 9px #ff9153;margin-right:9px}.bed{border:5px solid #272a25;border-radius:12px;overflow:hidden;background:repeating-linear-gradient(90deg,transparent 0 15px,#171812c7 16px,#49463d 17px,#25251f 19px,transparent 21px),radial-gradient(ellipse at 53% 63%,#6b392a,#413127 43%,#292b25 88%);box-shadow:inset 0 4px 12px #0008}.skewer{height:64px;border:0;padding:0;width:100%;position:relative;display:block;background:transparent;text-align:left;touch-action:manipulation}.skewer+.skewer{border-top:1px solid #b1ac8221}.skewer:enabled:hover{background:#ffdf7b14}.skewer:focus-visible{outline-offset:-3px}.skewer:disabled{opacity:.33}.skewer canvas{width:100%;height:100%;display:block}.flipping .skewer:enabled{background:#ff9c4522}.grillfoot{margin-top:12px;letter-spacing:.4px}.grillfoot span:last-child{font-family:ui-monospace,monospace;letter-spacing:2px}.ticket{color:var(--ink);background:radial-gradient(#bbab851f .7px,transparent .9px) 0 0/4px 4px,var(--paper);padding:22px 20px 26px;position:relative;filter:drop-shadow(0 6px 6px #0003);border-radius:4px 4px 0 0}.ticket:after{position:absolute;content:"";height:8px;bottom:-7px;left:0;right:0;background:linear-gradient(135deg,var(--paper) 25%,transparent 25%) -5px 0/10px 10px,linear-gradient(225deg,var(--paper) 25%,transparent 25%) -5px 0/10px 10px}.trayTop{justify-content:space-between}.trayTop h2{font:900 26px/1.2 "Songti SC",serif;margin:0}.count{font:700 14px ui-monospace,monospace}.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin:16px 0 12px}.slot{aspect-ratio:1;display:grid;place-items:center;border:1.4px dashed #bbab88;border-radius:9px;background:#fff9e78a;color:#bfaf8e}.slot.full{border-style:solid;background:#fff3d9}.slot canvas{width:100%;height:100%}.tip{font-size:12px;min-height:18px;margin:0 0 15px;color:#775f44}.packed{border-top:1px dashed #b9a885;padding-top:15px;display:flex;justify-content:space-between;font-size:14px}.packed b{font-family:ui-monospace,monospace}.bar{height:4px;background:#d7c9ac;border-radius:9px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:#af5835;transition:width .2s}.controls{margin-top:23px;gap:8px}.flip,.reset,.primary{border:0;border-radius:9px;min-height:44px;font-weight:700}.flip,.primary{background:var(--hot);color:#29231a}.flip{display:flex;align-items:center;justify-content:center;gap:7px;flex:1}.flip small{font-size:11px;background:#7a351d20;border-radius:4px;padding:2px 4px}.flip:disabled{background:#605f50;color:#cecab7}.reset{padding:0 12px;border:1px solid #777862;background:transparent;font-size:13px}.legend{gap:7px 14px;flex-wrap:wrap;margin:22px 0 0}.legend span{display:flex;align-items:center;color:#cfcdba;font-size:12px;gap:4px}.legend canvas{width:27px;height:27px}.legendTitle{font-size:12px;color:#aaa993;margin:0 0 -15px;margin-top:22px}.msg{color:#ffbe8f;font-size:13px;min-height:18px;margin:9px 0 0}.veil{position:fixed;inset:0;z-index:8;display:grid;place-items:center;background:#141611be;padding:22px}.veil[hidden]{display:none}.dialog{background:var(--paper);color:var(--ink);border-radius:16px;padding:27px;max-width:360px;width:100%;box-shadow:0 18px 70px #0008}.dialog h2{font:900 30px "Songti SC",serif;margin:0 0 12px}.dialog p{line-height:1.8;font-size:15px;margin:0 0 20px;white-space:pre-line}.primary{padding:0 20px;width:100%}.flight{position:fixed;width:46px;height:46px;z-index:5;pointer-events:none}.pop{animation:pop .28s ease-out}@keyframes pop{50%{transform:scale(1.07)}}

</style></head><body><main><header><div class="brand"><span class="mark"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M3 21 20 4m-9 1 8 8M7 9l8 8M4 14l6 6"/></svg></span>炭火夜摊</div><div class="topactions"><button class="mini" id="sound" aria-pressed="false">声音关</button><button class="mini" id="help">玩法&nbsp; ?</button></div></header><section class="hero"><div><h1>收摊了，<em>还剩一串</em></h1><p>点签头撸一块，凑齐三块同款就打包。</p></div><span class="stamp">炭火现烤</span></section><div class="layout"><section class="grill" aria-label="烤架"><div class="grillhead"><strong><i class="lamp"></i><b id="level"></b></strong><span id="remain"></span></div><div class="bed" id="bed"></div><div class="grillfoot"><span id="direction">◂ 从左边签尖开撸</span><span id="boardNo"></span></div></section><section class="side"><div class="ticket"><div class="trayTop"><h2>我的纸盘</h2><strong class="count" id="count"></strong></div><div class="slots" id="slots"></div><p class="tip" id="tip" role="status"></p><div class="packed">已打包<b id="packed"></b></div><div class="bar"><i id="bar"></i></div></div><div class="controls"><button class="flip" id="flip"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8h15l-4-4M21 16H6l4 4"/></svg><span id="flipText">翻个面</span><small id="uses"></small></button><button class="reset" id="reset">原盘重来</button></div><p class="msg" id="msg" role="status"></p><p class="legendTitle">本摊食材</p><div class="legend" id="legend"></div></section></div></main><div class="veil" id="veil" hidden><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><h2 id="modalTitle"></h2><p id="modalBody"></p><button id="modalBtn" class="primary"></button></section></div><script>
const $=id=>document.getElementById(id);
const names=['鱼丸','烤肠','莲藕','香菇','青椒'];
const boards=[[[1,3],[1,0],[1,0],[0,2],[2,3],[3,2]],[[2,2,3,1],[3,0,1,1],[1,0,2,0],[0,2,1,0],[3,3,2,3],[2,3,1,0]],[[4,3,0,4,1],[2,1,4,4,3],[3,0,3,1,2],[2,2,0,2,2],[1,1,4,0,1],[3,4,3,0,0]]];
const titles=['第一摊 · 刚起炭','第二摊 · 饭点到了','第三摊 · 最后一桌'];
let stage=0,rows=[],tray=[],packs=0,flips=1,turning=false,phase='play',audible=false,ac,action,lastFocus;
const reduce=matchMedia('(prefers-reduced-motion: reduce)');
function ellipse(c,x,y,a,b,color,rot=0){c.beginPath();c.ellipse(x,y,a,b,rot,0,Math.PI*2);c.fillStyle=color;c.fill()}
function shape(c,path,fill,stroke,width=1.5){let p=new Path2D(path);c.fillStyle=fill;c.fill(p);if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke(p)}}
function line(c,path,col,w){c.strokeStyle=col;c.lineWidth=w;c.lineCap='round';c.stroke(new Path2D(path))}
function grad(c,stops){const g=c.createLinearGradient(-10,-26,9,28);stops.forEach(([i,col])=>g.addColorStop(i,col));return g}
function food(c,id,x,y,s,angle=0){c.save();c.translate(x,y);c.scale(s,s);c.rotate(angle);ellipse(c,2,10,25,15,'#140e0a42');c.lineJoin='round';
if(id===0){let g=c.createRadialGradient(-9,-11,1,0,4,27);g.addColorStop(0,'#fff0b6');g.addColorStop(.55,'#e8b96c');g.addColorStop(.86,'#c78943');g.addColorStop(1,'#8c552d');ellipse(c,0,0,23,22,g);ellipse(c,-8,-9,6,3,'#fff5cbad',-.4);for(let i=0;i<16;i++){const a=i*2.4,r=7+(i*7%14);ellipse(c,Math.cos(a)*r,Math.sin(a)*r,1.25,.8,i%2?'#ac703b':'#f5d490',a)}}
if(id===1){shape(c,'M-24 -6 Q-23 -16 -12 -17 L15 -16 Q26 -15 26 -4 L25 6 Q24 16 13 17 L-13 17 Q-25 16 -25 5Z',grad(c,[[0,'#ffb174'],[.36,'#e77a4c'],[.76,'#bc492c'],[1,'#913b2b']]),'#8a4028');for(const x of [-14,-1,12]){c.save();c.translate(x,0);shape(c,'M-3 -10 Q0 -5 7 1 Q4 1 -1 -3Z','#ffcb87');line(c,'M-3 -10 Q-2 -5 7 1','#97422c',1.5);c.restore()}line(c,'M-16 11 Q-7 14 7 12','#ef8650',1.4)}
if(id===2){const path='M-25 -2 Q-26 -17 -13 -20 Q-4 -25 5 -20 Q18 -23 23 -12 Q30 -4 23 8 Q22 20 8 22 Q-4 27 -14 20 Q-27 16 -25 -2Z';c.save();c.translate(1,3);shape(c,path,'#ab7041');c.restore();shape(c,path,grad(c,[[0,'#ffe6aa'],[.63,'#efc584'],[1,'#db9d60']]),'#a97446');for(let i=0;i<6;i++){let a=i*Math.PI/3;ellipse(c,14*Math.cos(a),13*Math.sin(a),5.7,3.8,'#a7784c',a);ellipse(c,14*Math.cos(a)+.5,13*Math.sin(a)+1,4.1,2.6,'#604a35',a)}ellipse(c,0,0,3.5,3,'#93724c')}
if(id===3){shape(c,'M-12 6 Q-10 22 -2 23 Q7 24 11 10Z','#d4ab74','#8a6648');shape(c,'M-25 4 Q-26 -9 -16 -17 Q-4 -27 12 -20 Q26 -14 27 2 Q27 13 13 16 Q-3 20 -18 13 Q-25 10 -25 4Z',grad(c,[[0,'#d49961'],[.42,'#ac724b'],[.8,'#79503c'],[1,'#513b2c']]),'#5b402d');shape(c,'M-15 -12 Q-7 -10 0 -5 L10 -15 L5 -4 L17 2 L3 0 L-4 10 L-2 0Z','#f1d3a4');line(c,'M-17 8 Q-6 16 11 11','#ba8962',1.5)}
if(id===4){shape(c,'M-24 -7 Q-27 -15 -15 -17 Q-9 -24 -2 -17 Q7 -22 13 -14 Q25 -15 24 -2 L22 11 Q19 18 10 14 Q0 22 -7 14 Q-19 17 -22 8Z',grad(c,[[0,'#bdc975'],[.4,'#88a047'],[.7,'#657c34'],[1,'#455e2a']]),'#4e6033');line(c,'M-11 -11 Q-7 -2 -11 9 M4 -12 Q11 -5 6 9','#c1cd77',2.7)}c.restore()}
function miniFood(el,id){const c=el.getContext('2d');el.width=96;el.height=96;food(c,id,48,48,1.45,id===1?-.32:-.11)}
function drawRow(btn,i){const canvas=btn.firstChild,w=btn.clientWidth,h=btn.clientHeight,d=Math.min(devicePixelRatio||1,3);if(!w||!h)return;canvas.width=w*d;canvas.height=h*d;const c=canvas.getContext('2d');c.scale(d,d);let y=h*.51;const sx=w*.064,end=w*.95;c.save();c.shadowColor='#130d08bd';c.shadowBlur=5;c.shadowOffsetY=3;shape(c,'M'+sx+' '+y+' L'+(sx+13)+' '+(y-2.5)+' L'+end+' '+(y-2.5)+' L'+end+' '+(y+2.5)+' L'+(sx+13)+' '+(y+2.5)+'Z','#d8b078');c.restore();line(c,'M'+(sx+14)+' '+(y-1)+' H'+end,'#f0cf94',1);let grip=w*.84,gw=end-grip;c.fillStyle='#9d7143';c.beginPath();c.roundRect(grip,y-6,gw,12,4);c.fill();c.fillStyle='#e3bb80';c.beginPath();c.roundRect(grip,y-6,gw,9,3);c.fill();for(let k=1;k<4;k++)line(c,'M'+(grip+gw*k/5)+' '+(y-4)+' l-2 6','#b78956',.9);
const n=boards[stage][i].length,start=w*.19,space=(w*.56)/Math.max(n-1,2),size=Math.min(h/59,space/57,1.36);rows[i].forEach((v,j)=>{let x=start+(n-rows[i].length+j)*space;food(c,v,x,y-1,size,Math.sin(i*2.8+j*1.7)*.18);if(j===0){c.fillStyle='#ffb482';c.beginPath();c.moveTo(x-6,y+h*.4);c.lineTo(x+6,y+h*.4);c.lineTo(x,y+h*.4-5);c.fill()}})}
function drawAll(){[...$('bed').children].forEach(drawRow)}
function tone(freq,dur=.08){if(!audible)return;try{ac??=new (window.AudioContext||window.webkitAudioContext)();if(ac.state==='suspended')ac.resume().catch(()=>{});const o=ac.createOscillator(),g=ac.createGain();o.type='sine';o.frequency.value=freq;g.gain.setValueAtTime(.055,ac.currentTime);g.gain.exponentialRampToValueAtTime(.001,ac.currentTime+dur);o.connect(g);g.connect(ac.destination);o.start();o.stop(ac.currentTime+dur)}catch{}}
function modal(title,body,btn,fn){lastFocus=document.activeElement;$('modalTitle').textContent=title;$('modalBody').textContent=body;$('modalBtn').textContent=btn;action=fn;$('veil').hidden=false;document.querySelector('main').inert=true;$('modalBtn').focus()}
function closeModal(){document.querySelector('main').inert=false;$('veil').hidden=true;if(lastFocus?.isConnected&&!lastFocus.disabled)lastFocus.focus({preventScroll:true})}
$('modalBtn').onclick=()=>{closeModal();action?.()};
function render(note=''){const remaining=rows.flat().length,total=boards[stage].flat().length;$('level').textContent=titles[stage];$('boardNo').textContent='0'+(stage+1)+' / 03';$('remain').textContent='架上 '+remaining+' 块';$('count').textContent=tray.length+' / 5';$('tip').textContent=note||(tray.length===4?'只剩一格，找能凑齐的那一块！':'同款凑三块，自动腾出空位。');$('packed').textContent=packs+' / '+total/3+' 袋';$('bar').style.width=(packs*300/total)+'%';$('uses').textContent=flips+' 次';$('flip').disabled=!flips||phase!=='play';$('flipText').textContent=turning?'取消翻面':'翻个面';$('flip').setAttribute('aria-pressed',String(turning));$('bed').classList.toggle('flipping',turning);$('direction').textContent=turning?'↔ 点一根签，把两端对调':'◂ 从左边签尖开撸';$('slots').replaceChildren();for(let j=0;j<5;j++){let slot=document.createElement('div');slot.className='slot';if(j<tray.length){slot.classList.add('full');slot.setAttribute('aria-label',names[tray[j]]);let el=document.createElement('canvas');miniFood(el,tray[j]);slot.append(el)}else slot.textContent='·';$('slots').append(slot)}
[...$('bed').children].forEach((b,i)=>{b.disabled=phase!=='play'||rows[i].length<(turning?2:1);b.setAttribute('aria-label','第'+(i+1)+'串，'+(rows[i].map(v=>names[v]).join('、')||'已清空'));drawRow(b,i)})}
function fly(v,btn,slotIndex,beforeLength){if(reduce.matches)return;const r=btn.getBoundingClientRect(),t=$('slots').children[slotIndex].getBoundingClientRect(),n=boards[stage][Number(btn.dataset.i)].length;const x=r.x+r.width*(.19+.56*(n-beforeLength)/Math.max(n-1,2)),y=r.y+r.height/2,el=document.createElement('canvas');miniFood(el,v);el.className='flight';el.style.left=x-23+'px';el.style.top=y-23+'px';document.body.append(el);let dx=t.x+t.width/2-x,dy=t.y+t.height/2-y;el.animate([{transform:'translate(0,0) scale(1.1)'},{transform:'translate('+dx+'px,'+dy+'px) scale(.72)',opacity:.15}],{duration:230,easing:'ease-out'}).onfinish=()=>el.remove()}
function take(i){if(phase!=='play'||!$('veil').hidden||!rows[i].length)return;const r=rows[i];if(turning){if(r.length<2)return;r.reverse();flips=0;turning=false;tone(330);$('msg').textContent='签子已掉头，现在先撸'+names[r[0]]+'。';render();return}let n=r.length,v=r.shift(),slot=tray.length;tray.push(v);let matched=tray.filter(t=>t===v).length===3;let note='';if(matched){tray=tray.filter(t=>t!==v);packs++;note='三块'+names[v]+'，打包出餐！';tone(780,.16)}else tone(390+slot*42);$('msg').textContent='';if(rows.every(a=>!a.length))phase='won';else if(tray.length===5)phase='lost';render(note);fly(v,$('bed').children[i],slot,n);if(matched&&!reduce.matches){$('packed').animate([{transform:'scale(1.13)'},{transform:'scale(1)'}],{duration:230})}if(phase==='lost')modal('纸盘满啦','这次打包了 '+packs+' 袋。最后放进盘里的是'+names[v]+'，换个顺序再撸一次。','原盘再来',()=>start(stage));if(phase==='won'){let last=stage===boards.length-1;modal(last?'今晚收摊！':'这一摊清空了！',last?'三摊都清空了。最后一串打包，熄炭回家。':'热腾腾的 '+packs+' 袋都打包好了。下一摊的串更长，记得留个空位。',last?'重新开摊':'去下一摊',()=>start(last?0:stage+1))}}
function start(s){stage=s;rows=boards[s].map(r=>r.slice());tray=[];packs=0;flips=1;turning=false;phase='play';$('msg').textContent='';$('legend').replaceChildren();[...new Set(boards[s].flat())].sort().forEach(id=>{let span=document.createElement('span'),el=document.createElement('canvas');miniFood(el,id);span.append(el,names[id]);$('legend').append(span)});render()}
for(let i=0;i<6;i++){const b=document.createElement('button');b.className='skewer';b.dataset.i=i;b.append(document.createElement('canvas'));b.onclick=()=>take(i);$('bed').append(b)}
$('flip').onclick=()=>{if(!flips||phase!=='play')return;turning=!turning;$('msg').textContent=turning?'选一根至少有两块食材的签子掉头。':'';render()};$('reset').onclick=()=>start(stage);$('help').onclick=()=>modal('怎么撸串？','点一根签子，左边第一块食材就会落进纸盘。\n\n凑齐三块同款就打包。盘里有五块还没凑齐，摊子就忙不过来了。\n\n每摊能翻一次签。先点「翻个面」，再点一根签子，末尾的食材就转到最前面。','开撸',null);$('sound').onclick=()=>{audible=!audible;$('sound').textContent=audible?'声音开':'声音关';$('sound').setAttribute('aria-pressed',String(audible));tone(560)};window.addEventListener('resize',drawAll);start(0);
</script></body></html>
