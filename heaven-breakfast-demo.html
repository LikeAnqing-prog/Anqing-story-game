.cart-picture{position:relative;isolation:isolate;width:100%;margin-top:8px;transform-origin:50% 85%;translate:0 var(--tray-sink,0px);transition:translate .16s ease-out;filter:drop-shadow(0 2px 1px #6a4e3441)}
.cart-picture > img{display:block;width:100%;height:auto;pointer-events:none}
.cart-picture .tray-guide{position:absolute;z-index:2;left:-13%;bottom:32%;width:34%}
.cart-picture .tray-sprite{position:relative;z-index:1}
.play-area[data-room="front"][data-travelling="true"] .tray-guide{left:auto;right:-12%;scale:-1 1}
.cart-load{position:absolute;z-index:3;inset:0;pointer-events:none}
.cart-piece{position:absolute;display:block;width:var(--dish-width,19%);height:auto;transform:translate(-50%,-100%);filter:drop-shadow(0 2px 0 #5d361d60);pointer-events:none}
.cart-piece[data-dish="cake"]{--dish-width:20%}
.cart-piece[data-dish="soy"]{--dish-width:16%}
.cart-piece[data-row="back"]{width:calc(var(--dish-width,19%) * .88)}
.cart-ledger{display:flex;flex-direction:column;gap:4px;min-width:0;padding:4px 5px;border:1px solid #947556;border-radius:6px;background:#efdebb;box-shadow:inset 0 0 0 1px #fff2d0}
.cart-title{align-self:center;font:900 13px var(--serif);letter-spacing:.09em}
.cart-bins{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));width:100%;gap:4px}
.cart-bin{border:1px solid #947150;border-radius:4px;background:#f0debb;padding:0 3px;display:flex;align-items:center;justify-content:center;gap:3px;font-weight:700;font-size:12px;line-height:1.05;min-height:26px;white-space:nowrap}
.cart-bin:not(:disabled):hover{background:#fff1cf}
.cart-bin[data-count="0"] span{opacity:.76}
.cart-bin canvas{height:26px;width:26px;object-fit:contain;pointer-events:none}
.travel{width:100%;justify-self:end;max-width:217px}
.travel:disabled{opacity:.64}
.runner-feedback{margin:0;padding:6px 20px;min-height:33px;background:#f0e4c8;border:0;border-radius:0;border-top:1px solid #fff9e9}
.play-area{--cart-travel-x:12px;--cart-travel-tilt:2deg}
.play-area[data-room="front"]{--cart-travel-x:-12px;--cart-travel-tilt:-2deg}
.play-area[data-travelling="true"] .room{animation:trip-shade var(--travel-duration) ease-out both}
.play-area[data-travelling="true"] .cart-picture{animation:tray-cross var(--travel-duration) ease-out both}
@keyframes trip-shade{0%{filter:brightness(1)}to{filter:brightness(.92)}}
@keyframes tray-cross{0%{transform:translate(0,0)}48%{transform:translate(calc(var(--cart-travel-x) * .65),-7px)}to{transform:translate(var(--cart-travel-x),-3px) rotate(var(--cart-travel-tilt))}}
.play-area > .overlay{position:absolute;z-index:6}
@media(max-width:870px){.cart-bin canvas{display:none}}
@media(max-width:640px){
  .room{height:302px}
  .queue{height:188px}
  .guest .portrait,.guest-preview .portrait{width:min(100%,124px);height:auto;max-height:110px}
  #landscape{object-position:44% center}
  #kitchen-landscape{height:43%;object-position:54% center}
  .kitchen.room{padding:0 6px 7px}
  .kitchen.room #worktop{height:57%}
  .cart-picture .tray-guide{left:-5%;bottom:35%;width:31%}
  .play-area[data-room="front"][data-travelling="true"] .tray-guide{right:-4%}
  .kitchen-title h2{font-size:17px}
  .runner{grid-template-columns:minmax(0,1fr) auto;gap:5px 6px;padding:6px}
  .runner-info strong{font-size:16px}
  .runner-info span{font-size:11px}
  .cart{grid-column:1/3;grid-row:2;grid-template-columns:min(46vw,165px) minmax(0,1fr);gap:7px}
  .cart-ledger{gap:2px;padding:3px 4px}
  .cart-bins{gap:3px}
  .cart-bin{font-size:11px;min-height:25px}
  .travel{padding:4px 8px;min-height:38px;font-size:13px}
  .runner-feedback{font-size:11px;padding:4px 6px}
}
@media(max-width:355px){.room{height:278px}.cart-bins{grid-template-columns:1fr;gap:2px}.cart-bin{min-height:17px}}
</style>
</head>

const shape = (ctx, path, fill, stroke, width = 2) => {
  const area = new Path2D(path);
  ctx.fillStyle = fill;
  ctx.fill(area);
  if (stroke) {
    ctx.strokeStyle = stroke;
    ctx.lineWidth = width * 2;
    ctx.stroke(area);
  }
};
function oval(ctx, x, y, rx, ry, fill, stroke, width = 2) {
  ctx.beginPath();
  ctx.ellipse(x, y, rx, ry, 0, 0, Math.PI * 2);
  ctx.fillStyle = fill;
  ctx.fill();
  if (stroke) {
    ctx.lineWidth = width;
    ctx.strokeStyle = stroke;
    ctx.stroke();
  }
}
function rect(ctx, x, y, w, h, color) {
  ctx.fillStyle = color;

}
function line(ctx, path, color, width = 2) {

}

function ring(kind) {
  if (!soundOn) return;
  try {
    const Audio = window.AudioContext || window.webkitAudioContext;
    if (!audio) audio = new Audio();
    if (audio.state === 'suspended') audio.resume().catch(() => {});
    const notes = {on:[392,523], start:[237], ready:[643], serve:[523,659,784], wrong:[196], fail:[294,220], win:[523,659,784,1047]};
    notes[kind].forEach((hz,i) => {
      const t = audio.currentTime + i *.085;
      const tone = audio.createOscillator();
      const volume = audio.createGain();
      tone.type = 'sine';
      tone.frequency.setValueAtTime(hz,t);
      volume.gain.setValueAtTime(.11,t);
      volume.gain.exponentialRampToValueAtTime(.001,t+.16);
      tone.connect(volume);
      volume.connect(audio.destination);
      tone.start(t);tone.stop(t+.17);
    });
  } catch {}
}

  }, 2450);
}

function foodAsset(id) { return publishedArt[`assets/food/${id}.png`]; }
function setupCart() {
  for (const id of menu) {
    const el = button('',()=>unloadCart(id),'cart-bin');
    const icon = makeCanvas(90,72);
    dishArt(icon,id);
    const label = document.createElement('span');
    el.append(icon,label);
    $('#cart-bins').append(el);
    cartViews.set(id,{el,label});
    const art = new Image();
    art.src = foodAsset(id);
    art.decode().catch(() => {});
  }
  for (let index=0;index<cartPositions[7].length;index++) {
    const piece = document.createElement('img');
    piece.className = 'cart-piece';
    piece.alt = '';
    piece.draggable = false;
    piece.hidden = true;
    $('#cart-load').append(piece);
    cartPieces.push(piece);
  }
}
function paintCart() {
  const title = $('#cart-title');
  const positions = cartPositions[cartCapacity()];
  const count = cartCount();
  const summary = `云托盘 ${count} / ${positions.length}`;
  $('.cart-picture').style.setProperty('--tray-sink',`${count}px`);
  if (title.textContent !== summary) title.textContent = summary;
  const canUnload = canWorkIn('kitchen');
  const amounts = cartStock();
  for (const id of menu) {
    const {el,label} = cartViews.get(id);
    const amount = amounts[id];
    el.disabled = !canUnload || amount === 0;
    if (el.dataset.count === String(amount)) continue;
    el.dataset.count = amount;
    label.textContent = `${dishes[id].name} ×${amount}`;
    el.setAttribute('aria-label', `移除一份${dishes[id].name}，车上有 ${amount} 份`);
    el.title = `在石灶房点一下，移除一份${dishes[id].name}`;
  }
  cartPieces.forEach((piece,index)=>{
    const id = session?.cart[index];
    piece.hidden = !id;
    if (!id) return;
    const [x,y] = positions[index];
    piece.style.left = `${x}%`;
    piece.style.top = `${y}%`;
    piece.style.zIndex = y;
    piece.dataset.row = y < 45 ? 'back' : 'front';
    if (piece.dataset.dish === id) return;
    piece.dataset.dish = id;
    piece.src = foodAsset(id);
  });
}
function renderRooms() {
  const room = session?.room || 'front';
  const inKitchen = room === 'kitchen';
  const travelling = Boolean(session?.trip);
  backRoom.hidden = !inKitchen;
  frontRoom.hidden = inKitchen;
  $('#room-name').textContent = inKitchen ? '石灶房' : '候朝台';
  playArea.dataset.room = room;
  playArea.dataset.travelling = travelling;
  travel.disabled = mode !== 'play' || travelling;
  travel.textContent = travelling ? '正在过云桥…' : inKitchen ? '过桥去候朝台' : '过桥回石灶房';
  updateRouteHint();
  updateFrontDesk();
  paintCart();
}
function updateRouteHint() {
  const status = $('#other-room-status');
  let hint = '开摊后从石灶房出发';
  if (session?.room === 'kitchen') {
    const waiting = session.guests.filter(Boolean).length;
    hint = waiting ? `候朝台有 ${waiting} 位客人等餐` : '候朝台暂时没人等餐';
  } else if (session) {
    const slots = Object.values(session.slots).flat();
    const ready = slots.filter(slot=>slot.phase === 'ready').length;
    hint = slots.some(slot=>slot.phase === 'burned')
      ? '石灶房有餐点糊了'
      : ready ? `石灶房有 ${ready} 份餐已熟`
      : slots.some(slot=>slot.phase === 'cooking') ? '石灶房正在做餐' : '石灶房暂无餐在火上';
  }
  if (status.textContent !== hint) status.textContent = hint;
}
function requestTrip() {
  if (mode !== 'play' || session.trip) return;
  const to = session.room === 'kitchen' ? 'front' : 'kitchen';
  session.trip = {to, arrives:session.time + travelSeconds, refocus:document.activeElement === travel};
  renderRooms();
  paintStations();
  updateGuests();
}
function arrive() {
  const trip = session.trip;
  session.room = trip.to;
  session.trip = null;
  renderRooms();
  updateGuests();
  paintStations();
  if (trip.refocus) travel.focus({preventScroll:true});
  if (session.room === 'front') {
    feedback(cartCount() ? '到了候朝台。看订单，盘里备齐就点客人交餐。'
      : '到了候朝台。先看客人点了什么，再过桥回灶房。');
  } else {
    feedback('回到石灶房。餐点熟了，点器具放上云托盘。');
  }
}
function unloadCart(id) {
  if (!canWorkIn('kitchen')) return;
  const index = session.cart.indexOf(id);
  if (index < 0) return;
  session.cart[index] = null;
  feedback(`已从云托盘移除一份${dishes[id].name}。`,'',true);
  paintCart();
}
function updateFrontDesk() {
  const teaOwned = Boolean(progress.upgrades.tea);
  const teaUsed = Boolean(session?.teaUsed);
  const cashboxOwned = Boolean(progress.upgrades.cashbox);
  const canShop = mode === 'intro' || mode === 'result';
  tea.dataset.state = !teaOwned ? 'locked' : teaUsed ? 'used' : 'ready';
  tea.disabled = !canWorkIn('front') || !teaOwned || teaUsed;
  cashbox.dataset.state = canShop ? 'open' : 'closed';
  cashbox.disabled = !canShop;
  $('#tea-state').textContent = !teaOwned ? '待解锁' : teaUsed ? '本关已用' : mode === 'play' ? `点一下 +${teaSeconds} 秒` : '每关可用一次';
  $('#cashbox-state').textContent = canShop ? '铜钱铺' : cashboxOwned ? `每单 +${extraCoins} 铜钱` : '交餐收钱';
  for (const [id, owned] of [['tea',teaOwned],['cashbox',cashboxOwned]]) {
    const art = $(`#${id}-art`);
    if (art.dataset.upgraded !== String(owned)) {
      art.dataset.upgraded = owned;
      deskArt(art,id,owned);
    }
  }
}
function pourTea() {
  if (!canWorkIn('front') || !progress.upgrades.tea || session.teaUsed) return;
  const waiting = session.guests.filter(Boolean);
  if (!waiting.length) {
    feedback('现在没人排队，留着茶等下一拨客人。','',true);
    return;
  }
  for (const guest of waiting) guest.deadline += teaSeconds;
  session.teaUsed = true;
  updateGuests();
  updateFrontDesk();
  feedback(`给 ${waiting.length} 位客人倒了茶，每位多等 ${teaSeconds} 秒。`,'',true);
  ring('on');
}
function flashCoins(amount) {
  coinPop.textContent = `+${amount}`;
  coinPop.classList.remove('pop');
  void coinPop.offsetWidth;
  coinPop.classList.add('pop');
}
function noStockMessage(order) {
  const needed = {};
  for (const key of order) needed[key] = (needed[key] || 0) + 1;
  const available = cartStock();
  return Object.entries(needed)
    .filter(([id, amount]) => available[id] < amount)
    .map(([id, amount]) => `${amount - available[id]} 份${dishes[id].name}`).join('、');
}

function portraitSource(person, expression) {
  return publishedArt[`assets/characters/${person.sprite}${expressionSuffix[expression]}.png`];
}
function setPortraitExpression(portrait, person, expression) {
  if (portrait.dataset.expression === expression) return;
  portrait.dataset.expression = expression;
  portrait.src = portraitSource(person, expression);
}
function preloadExpressions() {
  for (const person of characters) {
    for (const expression of ['ordering','impatient']) {
      const image = new Image();
      image.src = portraitSource(person, expression);
      image.decode().catch(() => {});
    }
  }
}

function makeGuest(customer, preview = false) {
  const person = characters[customer.character];
  const el = preview ? document.createElement('div') : button('', () => serve(customer));
  el.className = preview ? 'guest-preview' : 'guest in';
  el.style.gridColumn = customer.slot + 1;
  el.style.gridRow = 1;
  const bubble = document.createElement('span');
  bubble.className = 'ticket';
  const items = document.createElement('span');
  items.className = 'order-items';
  const dishViews = customer.order.map(id => {
    const item = document.createElement('span');
    item.className = 'order-item';
    const icon = makeCanvas(90,72);
    dishArt(icon,id);
    const name = document.createElement('span');
    name.textContent = dishes[id].name;
    item.append(icon,name);
    items.append(item);
    return item;
  });
  const progress = document.createElement('span');
  progress.className = 'patience';
  progress.setAttribute('aria-hidden','true');
  const bar = document.createElement('i');
  progress.append(bar);
  bubble.append(items,progress);
  const portrait = document.createElement('img');
  portrait.className = 'portrait';
  setPortraitExpression(portrait,person,'waiting');
  portrait.alt = '';
  portrait.draggable = false;
  const name = document.createElement('span');
  name.className='guest-name';
  name.textContent=person.name;
  el.append(bubble,portrait,name);
  if (preview) el.setAttribute('aria-hidden','true');
  else {
    el.dataset.guest = customer.id;
    el.dataset.slot = customer.slot;
  }
  queue.append(el);
  return {el, bar, dishViews, portrait};
}
function previewGuests() {
  queue.replaceChildren();
  [
    {slot:0,character:0,order:['bun']},
    {slot:1,character:1,order:['soy']},
    {slot:2,character:2,order:['cake','soy']},
    {slot:3,character:3,order:['bun','cake']}
  ].forEach(guest => makeGuest(guest,true));
}
function updateGuests() {
  let active = false;
  const carried = cartStock();
  for (const guest of session.guests) {
    if (!guest) continue;
    active = true;
    const ratio = Math.min(1,Math.max(0,(guest.deadline - session.time)/guest.patience));
    const {el,bar,dishViews,portrait}=guest.view;
    const person = characters[guest.character];
    const urgent = ratio <= impatientRatio;
    const visible = canWorkIn('front');
    if (visible && guest.orderUntil === null) guest.orderUntil = session.time + orderingSeconds;
    const expression = urgent ? 'impatient' : guest.orderUntil !== null && session.time < guest.orderUntil ? 'ordering' : 'waiting';
    setPortraitExpression(portrait,person,expression);
    const tally = {};
    const matches = guest.order.map((id,i) => {
      tally[id] = (tally[id] || 0) + 1;
      const available = carried[id] >= tally[id];
      dishViews[i].classList.toggle('stocked', available);
      return available;
    });
    const complete = matches.every(Boolean);
    el.classList.toggle('ready',complete);
    el.classList.toggle('urgent',urgent);
    el.disabled = !visible;
    const label = `${person.name}要${guest.order.map(id=>dishes[id].name).join('、')}${complete?'，餐点已备齐':''}${urgent?'，快等不及了':''}`;
    if(el.getAttribute('aria-label') !== label) el.setAttribute('aria-label', label);
    bar.style.width = `${ratio*100}%`;
  }
  $('#empty').hidden = active || mode !== 'play';
}

function spawnGuests() {
  const orders = levels[levelIndex].orders;
  while (session.nextOrder < orders.length) {
    const [at,character,...order] = orders[session.nextOrder];
    if (at > session.time) return;
    const slot = session.guests.indexOf(null);
    if (slot < 0) return;
    queue.querySelector(`.guest.departed[data-slot="${slot}"]`)?.remove();
    const patience = characters[character].patience + levels[levelIndex].patienceBonus;
    const guest = {
      id:session.nextOrder++,
      slot, character, order, patience,
      orderUntil:null,
      deadline:session.time + patience
    };
    guest.view = makeGuest(guest);
    session.guests[slot] = guest;
  }
}
function removeGuest(guest) {
  session.guests[guest.slot] = null;
  guest.view.el.disabled = true;
  guest.view.el.classList.add('departed');
  window.setTimeout(() => guest.view.el.remove(),310);
}
function serve(guest) {
  if(!canWorkIn('front') || session.guests[guest.slot] !== guest) return;
  const missing = noStockMessage(guest.order);
  if(missing) {
    feedback(`盘里还缺 ${missing}，过桥回灶房补餐。`,'warning',true);
    guest.view.el.classList.remove('bump');
    void guest.view.el.offsetWidth;
    guest.view.el.classList.add('bump');
    ring('wrong');
    return;
  }
  const restoreFocus = document.activeElement === guest.view.el;
  for (const id of guest.order) session.cart[session.cart.indexOf(id)] = null;
  const fast = guest.deadline - session.time >= guest.patience*.48;
  const bonus = progress.upgrades.cashbox ? extraCoins : 0;
  const payment = 5 + guest.order.length*3 + (fast ? 2 : 0) + bonus;
  session.earned += payment;
  flashCoins(payment);
  paintCart();
  session.served++;
  removeGuest(guest);
  if (restoreFocus) playfield.focus({preventScroll:true});
  const note = bonus ? `（钱匣添了 ${bonus} 枚）` : fast ? '（含小费）' : '';
  feedback(`${characters[guest.character].name}取餐了，收到 ${payment} 枚铜钱${note}。`,'',true);
  ring('serve');
  updateHUD();
  paintStations();
  updateGuests();
  checkFinish();
}

function slotsFor(id) {
  const count = progress.upgrades[id] && id !== 'soy' ? 2 : 1;
  return Array.from({length:count},() => ({phase:'idle', until:0}));
}
function duration(id) { return id === 'soy' && progress.upgrades.soy ? .8 : dishes[id].seconds; }
function buildStations() {
  const stations = $('#stations');
  stations.replaceChildren();
  stationViews.clear();
  for (const id of menu) {
    const device = document.createElement('section');
    device.className = 'station';
    const head = document.createElement('div');
    head.className = 'station-top';
    const title = document.createElement('h3');
    title.textContent = dishes[id].station;
    head.append(title);
    const slots = document.createElement('div');
    slots.className = 'slots';
    const views = slotsFor(id).map((_,index) => {
      const el = button('',() => useSlot(id,index),'slot');
      el.dataset.kind = id;
      const image = makeCanvas(420,230,'equipment-art');
      const effect = document.createElement('span');
      effect.className = 'effect';
      effect.setAttribute('aria-hidden','true');
      effect.append(document.createElement('i'),document.createElement('i'));
      const badge = document.createElement('span');
      badge.className = 'slot-state';
      const heat = document.createElement('span');
      heat.className = 'heat';
      heat.setAttribute('aria-hidden','true');
      const bar = document.createElement('i');
      heat.append(bar);
      el.append(image,effect,badge,heat);
      slots.append(el);
      return {el,image,badge,bar};
    });
    device.append(head,slots);
    stations.append(device);
    stationViews.set(id,views);
  }
  paintStations();
}
function paintStations() {
  for (const [id,views] of stationViews) {
    views.forEach(({el,image,badge,bar},index) => {
      const slot = session?.slots[id][index];
      const phase = slot?.phase || 'idle';
      const elapsed = session?.time || 0;
      let label = dishes[id].start;
      let percent = 0;
      let urgent = false;
      if (phase === 'cooking') {
        label = `制作中 ${Math.ceil(slot.until-elapsed)}秒`;
        percent = 1 - (slot.until-elapsed)/duration(id);
      } else if (phase === 'ready') {
        label = '熟了 · 入盘';
        percent = Math.min(1,(slot.until-elapsed)/dishes[id].hold);
        if (id === 'soy') percent = 1;
        urgent = percent < .37;
      } else if (phase === 'burned') {
        label = '糊了 · 清理';
        percent = 1;
      }
      el.disabled = !canWorkIn('kitchen');
      if (el.dataset.phase !== phase) {
        el.dataset.phase = phase;
        equipmentArt(image,id,phase);
      }
      el.classList.toggle('urgent',urgent);
      if (badge.textContent !== label) badge.textContent = label;
      const accessible = `${dishes[id].station}${views.length > 1 ? ` ${index+1}号` : ''}，${label}`;
      if (el.getAttribute('aria-label') !== accessible) el.setAttribute('aria-label',accessible);
      bar.style.width = `${Math.max(0,percent)*100}%`;
    });
  }
}
function useSlot(id,index) {
  if(!canWorkIn('kitchen')) return;
  const slot = session.slots[id][index];
  const item = dishes[id];
  if(slot.phase === 'burned') {
    slot.phase = 'idle';
    feedback(`${item.station}清好了。`,'',true);
  } else if(slot.phase === 'ready') {
    const space = session.cart.indexOf(null);
    if(space < 0) {
      feedback('云托盘装满了。可以先去送餐，或移除一份腾地方。','warning',true);
      ring('wrong');
      return;
    }
    session.cart[space] = id;
    slot.phase = 'idle';
    paintCart();
    feedback(`${item.name}已放上云托盘。`,'',true);
    ring('ready');
  } else if(slot.phase === 'idle') {
    slot.phase = 'cooking';
    slot.until = session.time + duration(id);
    ring('start');
  }
  paintStations();
  updateGuests();
}
function tickSlots() {
  let ready = false;
  for (const id of menu) {
    for (const slot of session.slots[id]) {
      if (session.time < slot.until) continue;
      if (slot.phase === 'cooking') {
        slot.phase = 'ready';
        slot.until += dishes[id].hold;
        ready = true;
      } else if (slot.phase === 'ready') {
        slot.phase = 'burned';
        feedback(`${dishes[id].name}糊了，点厨具清理。`,'warning',true);
      }
    }
  }
  if (ready) ring('ready');
}

function updateHUD() {
  const level = levels[levelIndex];
  const time = Math.max(0, Math.ceil(level.seconds - (session?.time || 0)));
  $('#day-number').textContent = `第 ${levelIndex+1} / ${levels.length} 关`;
  $('#day-title').textContent = level.name;
  clock.textContent = `${time} 秒`;
  clockCard.classList.toggle('danger',time <= 10);
  servedText.textContent = `${session?.served || 0} / ${level.goal}`;
  coinText.textContent = progress.coins + (mode === 'play' || mode === 'pause' || (mode === 'help' && helpReturn === 'pause') ? session.earned : 0);
  misses.textContent = `走单 ${session?.misses || 0} / 3`;
  misses.classList.toggle('warning',(session?.misses || 0) >= 2);
}

function showPanel(heading, subtitle, detail, actions, preface, extra) {
  panel.replaceChildren();
  const subtitleLabel = document.createElement('p');
  subtitleLabel.className='preface';
  subtitleLabel.textContent=preface;
  const title=document.createElement('h2');
  title.id='panel-title';
  title.textContent=heading;
  const body=document.createElement('p');
  body.textContent=subtitle;
  panel.append(subtitleLabel,title);
  if (subtitle) panel.append(body);
  if (detail) {
    const note=document.createElement('p');
    note.className='detail';
    note.textContent=detail;
    panel.append(note);
  }
  if (extra) panel.append(extra);
  const controls=document.createElement('div');
  controls.className='actions';
  actions.forEach(([label, action], index) => controls.append(button(label, action, index === 0 ? 'primary' : 'secondary')));
  panel.append(controls);
  overlay.classList.toggle('larger', Boolean(extra));
  overlay.hidden=false;
  overlay.scrollTop=0;
  pause.disabled = mode !== 'pause';
  help.disabled = mode === 'help' || mode === 'shop';
  renderRooms();
  pause.textContent = mode === 'pause' ? '继续' : '暂停';
  paintStations();
  if (session) updateGuests();
  panel.focus({preventScroll:true});
}
function showIntro() {
  mode='intro';
  session=null;
  result=null;
  buildStations();
  previewGuests();
  $('#empty').hidden=true;
  updateHUD();
  const completed=progress.next === levels.length;
  const actions = [
    [completed ? '再接一轮' : (levelIndex === 0 ? '开摊' : '继续营业'),() => start(levelIndex)],
    ['铜钱铺',showShop],['怎么玩',showHelp]
  ];
  if (levelIndex > 0) actions.push(['重玩第一关',()=>start(0)]);
  showPanel('开门卖早饭', '候朝台的云受不了灶火。你在石灶房做早点，扶着云托盘过桥，赶在点卯前送到。',
    `${levels[levelIndex].seconds} 秒内招待 ${levels[levelIndex].goal} 位客人，走单 3 位就打烊。`,
    actions, completed ? '三关已通关' : '南天门早餐摊');
}
function start(index) {
  levelIndex=index;
  mode='play';
  result=null;
  session={
    time:0,room:'kitchen',trip:null,
    cart:Array(cartCapacity()).fill(null),
    slots:Object.fromEntries(menu.map(id=>[id,slotsFor(id)])),
    guests:[null,null,null,null],nextOrder:0,served:0,earned:0,misses:0,teaUsed:false
  };
  queue.replaceChildren();
  buildStations();
  overlay.hidden=true;
  pause.disabled=false;
  pause.textContent='暂停';
  help.disabled=false;
  coinPop.classList.remove('pop');
  renderRooms();
  feedback('先备些常用早点。熟了点一下入盘，再过桥看看客人点了什么。');
  spawnGuests();
  updateGuests();
  updateHUD();
  ring('on');
  priorFrame=null;
  playfield.focus({preventScroll:true});
}
function checkFinish() {
  if(mode !== 'play') return;
  const level=levels[levelIndex];
  if(session.misses >= 3) {
    settle(false,'三位客人等不及，先去上早朝了。');
  } else if(session.time >= level.seconds || (session.nextOrder === level.orders.length && session.guests.every(x=>!x))) {
    const won=session.served >= level.goal;
    settle(won,won ? '这顿早饭，神仙们吃上了。' : '这次招待的人数差一点，再开一摊。');
  }
}
function settle(won, message) {
  mode='result';
  if (won) {
    if (progress.next === levelIndex) progress.next++;
    progress.coins += session.earned;
    saveProgress();
  }
  result={won, message};
  updateHUD();
  feedback(won ? '营业结束。' : '打烊了，可以重开这一关。');
  ring(won?'win':'fail');
  showResult();
}
function showResult() {
  mode='result';
  const {won,message}=result;
  const final=won && levelIndex===levels.length-1;
  const next = Math.min(levels.length - 1,Math.max(levelIndex + 1,progress.next));
  const nextLabel = final ? '再玩第三关' : next > levelIndex + 1 ? `继续第 ${next+1} 关` : '开下一摊';
  const actions=won
    ? [[nextLabel,()=>start(next)],['铜钱铺',showShop],['重玩本关',()=>start(levelIndex)]]
    : [['重开这一关',()=>start(levelIndex)],['铜钱铺',showShop]];
  if (levelIndex > 0) actions.push(['回第一关',()=>start(0)]);
  const payment = won ? ` · 铜钱 +${session.earned}` : '';
  const detail = `招待 ${session.served} / ${levels[levelIndex].goal} 位${payment}`;
  showPanel(won?(final?'天庭早市全通关':'今日顺利收摊'):'今天先打烊',message,detail,actions,levels[levelIndex].name);
}
function showShop() {
  if (mode !== 'intro' && mode !== 'result') return;
  shopReturn = mode;
  mode = 'shop';
  renderShop();
}
function closeShop() {
  if (shopReturn === 'result') showResult();
  else showIntro();
}
function renderShop(unlocked = '') {
  const market = document.createElement('div');
  market.className = 'market';
  for (const [id, item] of Object.entries(upgrades)) {
    const bought = Boolean(progress.upgrades[id]);
    const offer = button('',() => {
      if (mode !== 'shop' || progress.upgrades[id] || progress.coins < item.price) return;
      progress.coins -= item.price;
      progress.upgrades[id] = true;
      saveProgress();
      updateHUD();
      ring('on');
      renderShop(item.upgrade);
    },'sale');
    offer.dataset.upgrade = id;
    offer.dataset.owned = bought;
    offer.dataset.group = dishes[id] ? 'kitchen' : 'front';
    const name = document.createElement('strong');
    name.textContent = item.upgrade;
    const description = document.createElement('span');
    description.textContent = item.benefit;
    const price = document.createElement('span');
    price.textContent = bought ? '已解锁' : `${item.price} 铜钱`;
    offer.disabled = bought || progress.coins < item.price;
    offer.append(name,description,price);
    market.append(offer);
  }
  const detail = unlocked ? `${unlocked}已解锁 ｜ 余 ${progress.coins} 铜钱` : `手头有 ${progress.coins} 铜钱。重玩过关也能攒钱。`;
  showPanel('铜钱铺','',detail,[['返回早餐摊',closeShop]],'收摊后添置',market);
}
function pauseGame() {
  if(mode!=='play') return;
  mode='pause';
  showPanel('歇一口气', '灶火和客人的耐心都暂停了。','',
    [['继续营业',resume],['重开本关',()=>start(levelIndex)]],'营业暂停');
}
function resume() {
  mode='play';
  overlay.hidden=true;
  priorFrame=null;
  pause.disabled=false;
  pause.textContent='暂停';
  help.disabled=false;
  paintStations();
  updateGuests();
  renderRooms();
  playfield.focus({preventScroll:true});
}
let helpReturn='intro';
function showHelp() {
  helpReturn=mode==='play'?'pause':mode;
  mode='help';
  showPanel('怎么开摊', '在石灶房点器具做餐，熟了再点一次就放上云托盘。过桥去候朝台看单，盘里备齐就点客人交餐。',
    '少了哪份就过桥回灶房做。往返时客人照常等，灶上的包子和饼放久了也会糊。',
    [[helpReturn==='pause'?'继续营业':'知道了', () => {
      if(helpReturn==='pause') resume();
      else if(helpReturn==='result') showResult();
      else showIntro();
    }]],'玩法');
}

let priorFrame=null;
function frame(now) {
  const delta=priorFrame===null ? 0 : Math.min(.25,(now-priorFrame)/1000);
  priorFrame=now;
  if(mode==='play') {
    session.time+=delta;
    if (session.trip && session.time >= session.trip.arrives) arrive();
    tickSlots();
    for (const guest of session.guests) {
      if (guest && session.time>=guest.deadline) {
        removeGuest(guest);
        session.misses++;
        feedback(`${characters[guest.character].name}等不及，先走了。`,'warning',true);
        ring('wrong');
      }
    }
    checkFinish();
    if(mode==='play') {
      spawnGuests();
      updateGuests();
      updateRouteHint();
      paintStations();
      updateHUD();
    }
  }
  requestAnimationFrame(frame);
}
pause.addEventListener('click',()=>{ if(mode==='pause') resume();else pauseGame(); });
help.addEventListener('click',showHelp);
cashbox.addEventListener('click',showShop);
tea.addEventListener('click',pourTea);
travel.addEventListener('click',requestTrip);
sound.addEventListener('click',()=>{
  soundOn=!soundOn;
  sound.textContent=soundOn?'音效开':'静音';
  sound.setAttribute('aria-label',soundOn?'关闭音效':'开启音效');
  sound.setAttribute('aria-pressed',String(soundOn));
  if(soundOn) ring('on');
});
sound.setAttribute('aria-label','开启音效');
document.addEventListener('visibilitychange',()=>{ if(document.hidden) pauseGame(); });
document.addEventListener('keydown',event=>{
  if (event.key==='Escape') {
    if(mode==='play') pauseGame();
    else if(mode==='pause') resume();
    else if(mode==='shop') closeShop();
  }
  if(event.key!=='Tab' || overlay.hidden) return;
  const tabbable=[...panel.querySelectorAll('button:not(:disabled)')];
  const first=tabbable[0];
  const last=tabbable.at(-1);
  if (!first) return;
  if (event.shiftKey && (document.activeElement===first || !panel.contains(document.activeElement) || document.activeElement===panel)) {
    event.preventDefault();
    last.focus();
  } else if (!event.shiftKey && (document.activeElement===last || !panel.contains(document.activeElement))) {
    event.preventDefault();
    first.focus();
  }
});
paintWorktop();
playArea.style.setProperty('--travel-duration',`${travelSeconds}s`);
setupCart();
preloadExpressions();
showIntro();
requestAnimationFrame(frame);
</script>
</body>
</html>
